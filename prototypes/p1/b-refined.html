<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>B · 留白 · 精简浏览</title>
  <style>
    :root{--paper:#faf8f3;--ink:#29332a;--olive:#53664a;--soft:#e9ede1;--line:#dfe2d8}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overscroll-behavior:none}body{background:#e6e7e1;color:var(--ink);font-family:"Microsoft YaHei",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer;border:0;background:none}button:focus-visible,input:focus-visible{outline:2px solid var(--olive);outline-offset:3px}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}[x-cloak]{display:none!important}
    .app{position:relative;width:min(100%,430px);height:100dvh;margin:auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}.viewer{position:relative;flex:1;min-height:0;background:#e6e4db;isolation:isolate;touch-action:none}.viewer video{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none}.surface{position:absolute;inset:0;width:100%;display:grid;place-items:center;padding:0;z-index:1}.paused{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;color:white;background:#18221b70;backdrop-filter:blur(5px);transition:opacity 140ms}.paused svg{width:26px;height:26px;margin-left:3px;fill:currentColor;stroke:none}
    .more{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));right:12px;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#faf8f3ed;color:#34412e;box-shadow:0 1px 8px #17211515}.more svg{width:23px;height:23px}.controls{position:absolute;z-index:2;bottom:0;left:0;right:0;padding:24px 16px 7px;background:linear-gradient(transparent,#1420189c);color:white;transition:opacity 140ms}.time-row{display:flex;justify-content:space-between;align-items:center;font-family:Georgia,serif;font-size:12px;font-variant-numeric:tabular-nums}.time-row button{font-size:12px;color:white;min-height:28px;padding:0 0 0 12px}.seek{display:block;width:100%;height:20px;margin:0;appearance:none;background:transparent;cursor:pointer;touch-action:pan-x}.seek::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,#f8f7ef var(--progress),#ffffff70 var(--progress));border-radius:3px}.seek::-webkit-slider-thumb{appearance:none;width:8px;height:8px;border-radius:50%;background:#faf8f3;margin-top:-3px}.seek::-moz-range-track{height:2px;background:#ffffff80}.seek::-moz-range-progress{height:2px;background:#faf8f3}.seek::-moz-range-thumb{height:8px;width:8px;border:0;border-radius:50%;background:#faf8f3}
    .tagbar{height:46px;flex:none;display:flex;gap:8px;align-items:center;padding:0 16px;overflow-x:auto;scrollbar-width:none}.tagbar::-webkit-scrollbar{display:none}.tag-filter{height:34px;min-width:58px;padding:0 10px;flex:none;display:flex;align-items:center;gap:4px;font-size:13px;border-radius:18px;color:var(--olive);white-space:nowrap;transition:background 120ms,color 120ms}.tag-filter .hash{opacity:.7}.tag-filter.active{background:var(--olive);color:#fff}.tag-filter .tick{width:12px;height:12px;stroke-width:2}.tag-filter:not(.active):hover{background:var(--soft)}
    footer{flex:none;border-top:1px solid var(--line);padding-bottom:max(9px,env(safe-area-inset-bottom))}nav{height:49px;width:300px;max-width:100%;margin:auto;display:flex;align-items:center;justify-content:space-between}nav button{width:66px;min-height:46px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#61695b;font-size:10px}nav svg{width:18px;height:18px}nav .selected{color:#3f5833}nav .selected svg{stroke-width:2}.home-indicator{height:3px;width:96px;border-radius:9px;background:#c2c8b9;margin:0 auto}
    .dismiss{position:absolute;inset:0;z-index:3;cursor:default}.menu{position:absolute;z-index:4;right:12px;top:60px;width:192px;padding:7px;background:var(--paper);border:1px solid #d9ded1;border-radius:13px;box-shadow:0 10px 35px #18231c26;transform-origin:top right}.menu button{height:46px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:0 12px;border-radius:7px;font-size:14px}.menu button:hover{background:var(--soft)}.menu .danger{color:#914e46;border-top:1px solid var(--line);border-radius:0;margin-top:4px}.menu svg{width:19px;height:19px}.menu-enter{transition:opacity 140ms,transform 140ms}.menu-start{opacity:0;transform:translateY(-5px) scale(.98)}
    .backdrop{position:absolute;inset:0;z-index:6;background:#17251d38}.sheet{position:absolute;z-index:7;bottom:0;left:0;right:0;background:var(--paper);padding:22px 22px 26px;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #17251d15}.sheet h2{font-family:SimSun,serif;font-size:23px;font-weight:500;margin:0 0 18px}.sheet p{font-size:13px;line-height:1.8;margin:0 0 14px;overflow-wrap:anywhere}.sheet .close{position:absolute;right:14px;top:13px;width:40px;height:40px;font-size:23px;color:#53664a}.editor-tags{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 22px}.editor-tags button{height:42px;padding:0 17px;border-radius:24px;background:#e8ecdf;font-size:14px}.editor-tags .chosen{background:var(--olive);color:#fff}.done{height:44px;background:var(--olive);color:white;border-radius:8px;padding:0 25px;font-size:14px;float:right}.toast{position:absolute;z-index:8;bottom:116px;left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;background:#2d3c2e;color:white;padding:11px 16px;font-size:13px;border-radius:9px}.toast button{color:#e0edcd;font-weight:600;min-height:30px}.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#53664a;font-size:15px}.empty button{margin-top:18px;text-decoration:underline;text-underline-offset:5px;font-size:13px}.error{position:absolute;left:20px;right:20px;top:46%;z-index:2;background:var(--paper);border-radius:10px;padding:15px;font-size:13px}.error button{color:var(--olive);text-decoration:underline;margin-left:12px}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
  <script src="b-refined.js"></script>
  <script defer src="vendor/alpine.min.js"></script>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 4h9l9 9-8 8-10-10Z"/><circle cx="8" cy="9" r="1.2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
  <symbol id="i-browse" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="m10 8 6 4-6 4Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<div class="app" x-data="paperViewer()" @keydown.escape.window="closePanels()" @keydown.arrow-down.window.prevent="step(1)" @keydown.arrow-up.window.prevent="step(-1)">
  <main class="viewer" aria-label="视频浏览" @pointerdown="pointerStart($event)" @pointerup="pointerEnd($event)" @pointercancel="pointer=null" @wheel.prevent="wheel($event)">
    <video x-ref="video" :poster="current?.poster" muted loop playsinline preload="metadata" :aria-label="current?.name" @loadedmetadata="duration=$event.target.duration" @timeupdate="time=$event.target.currentTime" @play="paused=false" @pause="paused=true" @error="mediaError=true"></video>
    <button x-show="current" class="surface" :aria-label="paused ? '播放视频' : '暂停视频'" @click="tap()"><span class="paused" x-show="paused" x-cloak><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg></span></button>
    <button x-show="current" class="more" aria-label="更多" aria-haspopup="menu" :aria-expanded="menu" @click="menu=!menu"><svg><use href="#i-more"/></svg></button>
    <div class="controls" x-show="current && paused" x-cloak>
      <div class="time-row"><span><span x-text="format(time)"></span> / <span x-text="format(duration)"></span></span><button aria-label="切换播放速度" @click="speed = speed===1 ? 1.5 : speed===1.5 ? 2 : 1; $refs.video.playbackRate=speed" x-text="speed.toFixed(1)+'×'"></button></div>
      <input class="seek" type="range" min="0" :max="duration || 5" step="0.01" :value="time" :style="'--progress:'+(duration ? time/duration*100 : 0)+'%'" aria-label="播放进度" @input="$refs.video.currentTime=Number($event.target.value);time=Number($event.target.value)">
    </div>
    <div class="empty" x-show="!current" x-cloak><span>没有符合条件的视频</span><button @click="filters=[];index=0;loadClip()">清除筛选</button></div>
    <div class="error" x-show="mediaError" x-cloak>这段视频暂时无法播放<button @click="loadClip()">重试</button></div>
    <button class="dismiss" x-show="menu" @click="menu=false" aria-label="关闭菜单" x-cloak></button>
    <div class="menu" role="menu" aria-label="视频操作" x-show="menu" x-transition:enter="menu-enter" x-transition:enter-start="menu-start" x-transition:enter-end="" x-cloak>
      <button role="menuitem" @click="editTags()"><svg><use href="#i-tag"/></svg>打标签</button>
      <button role="menuitem" @click="menu=false;panel='details'"><svg><use href="#i-info"/></svg>视频详情</button>
      <button class="danger" role="menuitem" @click="removeClip()"><svg><use href="#i-trash"/></svg>移入回收站</button>
    </div>
  </main>
  <section class="tagbar" aria-label="点击标签筛选视频">
    <template x-for="tag in visibleTags" :key="tag"><button class="tag-filter" :class="{'active':filters.includes(tag)}" :aria-pressed="filters.includes(tag)" :data-tag="tag" @click="toggleFilter(tag)"><span class="hash">#</span><span x-text="tag"></span><svg class="tick" x-show="filters.includes(tag)"><use href="#i-check"/></svg></button></template>
  </section>
  <footer><nav aria-label="主导航">
    <button class="selected" aria-current="page"><svg><use href="#i-browse"/></svg><span>浏览</span></button>
    <button><svg><use href="#i-grid"/></svg><span>视频库</span></button>
    <button><svg><use href="#i-tag"/></svg><span>标签</span></button>
    <button><svg><use href="#i-settings"/></svg><span>设置</span></button>
  </nav><div class="home-indicator"></div></footer>
  <div class="backdrop" x-show="panel" @click="closePanels()" x-cloak></div>
  <section class="sheet" role="dialog" :aria-label="panel==='tags' ? '编辑标签' : '视频详情'" aria-modal="true" x-show="panel" @keydown.tab="trapFocus($event)" x-cloak>
    <button class="close" aria-label="关闭" @click="closePanels()">×</button>
    <template x-if="panel==='tags'"><div><h2>打标签</h2><div class="editor-tags"><template x-for="tag in allTags" :key="tag"><button :class="{'chosen':draftTags.includes(tag)}" :aria-pressed="draftTags.includes(tag)" @click="draftTags.includes(tag) ? draftTags=draftTags.filter(t=>t!==tag) : draftTags.push(tag)" x-text="tag"></button></template></div><button class="done" @click="saveTags()">完成</button></div></template>
    <template x-if="panel==='details'"><div><h2>视频详情</h2><p x-text="current?.name"></p><p x-text="(current?.orientation || '')+' · MP4 · '+format(duration)"></p></div></template>
  </section>
  <div class="toast" role="status" x-show="deleted" x-cloak><span>已移入回收站</span><button @click="undo()">撤销</button></div>
</div>
</body></html>
