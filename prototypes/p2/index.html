<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>留白 · 私人视频库</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><script defer src="../p1/vendor/alpine.min.js"></script></head><body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 6h7l2 3h9v11H3zM3 6V4h7l2 2h8v3"/></symbol>
<symbol id="random" viewBox="0 0 24 24"><path d="M3 7h3c4 0 8 10 12 10h3m-4-4 4 4-4 4M3 17h3c1.5 0 3-1.5 4.5-4M14 9c1.5-1.5 2.5-2 4-2h3m-4-4 4 4-4 4"/></symbol>
<symbol id="sequence" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 4v4m-1 2h2l-2 4h2m-2 2h2v4H2"/></symbol>
<symbol id="tag" viewBox="0 0 24 24"><path d="M3 4h9l9 9-8 8-10-10Z"/><circle cx="8" cy="9" r="1.2"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
<symbol id="browse" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="m10 8 6 4-6 4Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="m4 16 12-12 4 4L8 20H4zM13 7l4 4"/></symbol>
<symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
<symbol id="archive" viewBox="0 0 24 24"><path d="M4 8h16v13H4zM3 3h18v5H3zM9 12h6"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></symbol>
<symbol id="backup" viewBox="0 0 24 24"><path d="M5 3h12l3 3v15H4V3zM8 3v6h8V3M8 21v-7h8v7"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="m9 7 3-3a5 5 0 0 1 7 7l-3 3M15 17l-3 3a5 5 0 0 1-7-7l3-3M8 16l8-8"/></symbol>
<symbol id="filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></symbol>
</defs></svg>
<div class="app" x-data="videoLibrary()" @keydown.escape.window="fullscreen?exitFullscreen():menu?menu=false:closePanel()" @keydown.arrow-down.window="if(!['INPUT','SELECT'].includes($event.target.tagName)){ $event.preventDefault();step(1)}" @keydown.arrow-up.window="if(!['INPUT','SELECT'].includes($event.target.tagName)){ $event.preventDefault();step(-1)}">
  <header class="topbar"><div class="title-wrap"><button class="back" x-show="!mainPage" aria-label="返回设置" @click="back()" x-cloak><svg><use href="#back"/></svg></button><h1 x-text="pageTitle">浏览</h1></div><div class="position" x-show="isMedia" role="status" :aria-label="'第'+(current?index+1:0)+'条，共'+round.length+'条'"><span x-text="String(current?index+1:0).padStart(2,'0')"></span><small>/</small><small x-text="String(round.length).padStart(2,'0')"></small></div><div class="header-actions"><button x-show="isMedia" :class="{'active':folder}" aria-label="选择文件夹" :title="folder||'全部媒体目录'" @click="openFolder()"><svg><use href="#folder"/></svg></button><button x-show="isMedia" :aria-label="playMode==='random'?'播放模式：随机':'播放模式：顺序'" @click="openPanel('order')"><svg><use :href="playMode==='random'?'#random':'#sequence'"/></svg></button><button aria-label="更多" aria-haspopup="menu" :aria-expanded="menu" @click="menu=!menu"><svg><use href="#more"/></svg></button></div></header>
  <div class="busy-line" x-show="busy" role="status" aria-label="正在处理" x-cloak></div>
  <div class="error-banner" x-show="error" role="alert" x-cloak><span x-text="error"></span><button aria-label="关闭错误提示" @click="error=''"><svg><use href="#close"/></svg></button></div>

  <main class="viewer" :class="{'is-wide':fullscreen}" x-show="page==='browse'" aria-label="视频浏览" @pointerdown="pointerStart($event)" @pointerup="pointerEnd($event)" @pointercancel="pointer=null" @wheel.prevent="wheel($event)">
    <div class="video-plane"><video id="player" :poster="poster(current)" muted loop playsinline preload="metadata" :aria-label="current?.name" @loadedmetadata="duration=$event.target.duration" @timeupdate="time=$event.target.currentTime" @play="paused=false" @pause="paused=true" @error="if(current)mediaError=true"></video>
    <button x-show="current" class="surface" :aria-label="paused?'播放视频':'暂停视频'" @click="tap()"><span class="paused" x-show="paused" x-cloak><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8Z"/></svg></span></button>
    <div class="controls" x-show="current&&paused" x-cloak><div class="time-row"><span><span x-text="format(time)"></span> / <span x-text="format(duration)"></span></span><button aria-label="切换播放速度" @click="speed=speed===1?1.5:speed===1.5?2:1;player().playbackRate=speed" x-text="speed.toFixed(1)+'×'"></button></div><input class="seek" type="range" min="0" :max="duration||5" step=".01" :value="time" :style="'--progress:'+(duration?time/duration*100:0)+'%'" aria-label="播放进度" @input="player().currentTime=Number($event.target.value);time=Number($event.target.value)"></div>
    <button class="wide-button" x-show="current?.orientation==='landscape'&&!fullscreen" @click="enterFullscreen()" aria-label="横屏全屏播放" x-cloak><svg><use href="#expand"/></svg>横屏</button><button class="fullscreen-exit" x-show="fullscreen" @click="exitFullscreen()" aria-label="退出横屏全屏" x-cloak><svg><use href="#back"/></svg>返回</button>
    <button class="cleanup-delete" x-show="cleanup&&current" :disabled="busy" @click="removeVideo([current.id])" aria-label="删除当前视频" x-cloak><svg><use href="#trash"/></svg></button>
    <div class="empty" x-show="!current" x-cloak><svg><use href="#browse"/></svg><p x-text="videos.length?'没有符合条件的可播放视频':'视频库还是空的'"></p><button class="secondary" x-show="filters.length||folder||attrs.orientation||attrs.duration||attrs.type" @click="folder='';setFilters([],{orientation:'',duration:'',type:''})">清除筛选</button><button class="secondary" x-show="!videos.length" @click="navigate('roots')">查看媒体目录</button></div>
    <div class="media-error" x-show="mediaError" x-cloak><p>这段视频暂时无法播放</p><button @click="loadVideo(false)">重试</button></div>
    <div class="end-note" x-show="roundEnded" x-cloak>本轮已看完<button @click="newRound()">开始新一轮</button></div>
    </div>
  </main>
  <section class="tagbar" x-show="page==='browse'" aria-label="当前范围与快捷标签"><button class="folder-scope" x-show="folder" :aria-label="'当前目录 '+folder" @click="openFolder()" x-cloak><svg><use href="#folder"/></svg><span x-text="folder.split('/').filter(Boolean).slice(-2).join(' / ')"></span></button><template x-for="tag in visibleTags" :key="tag"><button class="tag-filter" :class="{'active':filters.includes(tag)}" :aria-pressed="filters.includes(tag)" :data-tag="tag" @click="toggleFilter(tag)"><span class="hash">#</span><span x-text="tag"></span><svg x-show="filters.includes(tag)"><use href="#check"/></svg></button></template></section>

  <main class="page-body library" x-show="page==='library'" x-cloak>
    <div class="toolbar"><p><span x-text="libraryVideos.length"></span> 个视频</p><div><button class="text-button" @click="openAttributes()">属性筛选</button><button class="text-button" @click="selecting=!selecting;selected=[]" x-text="selecting?'取消多选':'多选'"></button></div></div>
    <div class="search-row"><input class="search" type="search" aria-label="搜索视频" placeholder="搜索视频" x-model="search"><button class="secondary" @click="newRound();navigate('browse')" :disabled="!candidates.length">播放</button></div>
    <div class="scope-line" x-show="folder||filters.length||attrs.orientation||attrs.duration||attrs.type"><span x-show="folder" x-text="folder"></span><template x-for="tag in filters" :key="tag"><button @click="toggleFilter(tag)"><span x-text="'# '+tag"></span><svg><use href="#close"/></svg></button></template><span x-show="attrs.orientation" x-text="attrs.orientation==='portrait'?'竖版':'横版'"></span><span x-show="attrs.duration" x-text="attrs.duration==='short'?'10 秒以内':'10 秒以上'"></span></div>
    <div class="library-grid"><template x-for="video in libraryVideos" :key="video.id"><article class="video-tile"><button class="tile-picture" :aria-label="'播放 '+video.name" @click="selecting?select(video.id):openVideo(video)"><img :src="poster(video)" :alt="video.name"><span class="duration" x-text="format(video.duration)"></span></button><button class="tile-select" :class="{'checked':selected.includes(video.id)}" :aria-label="'选择 '+video.name" :aria-pressed="selected.includes(video.id)" x-show="selecting" @click="select(video.id)"><svg x-show="selected.includes(video.id)"><use href="#check"/></svg></button><h3 x-text="video.name"></h3><div class="tile-caption"><span x-text="video.orientation==='portrait'?'竖版 · MP4':'横版 · MP4'"></span><span x-text="categoryName(video)"></span></div><p class="tile-tags" x-text="video.tags.map(t=>'# '+t).join('　')"></p></article></template></div>
    <div class="empty" x-show="!libraryVideos.length"><svg><use href="#grid"/></svg><p x-text="videos.length?'没有符合条件的视频':'还没有发现视频'"></p><button class="secondary" @click="search='';folder='';setFilters([],{orientation:'',duration:'',type:''})" x-show="videos.length">清除条件</button><button class="secondary" x-show="!videos.length" @click="navigate('roots')">接入媒体目录</button></div>
  </main>

  <main class="page-body" x-show="page==='tags'" x-cloak><div class="toolbar"><p><span x-text="tags.length"></span> 个标签</p><button class="text-button" @click="openTagForm()">新建标签</button></div><input class="search" aria-label="搜索标签" type="search" placeholder="搜索标签" x-model="tagSearch"><div style="margin-top:12px"><template x-for="tag in tagResults" :key="tag"><div class="row"><button class="tag-name grow" @click="setFilters([tag]);navigate('library')" x-text="tag"></button><span class="tag-count" x-text="tagCount(tag)"></span><div class="row-actions"><button :aria-label="'重命名 '+tag" @click="openTagForm(tag)"><svg><use href="#edit"/></svg></button><button class="danger" :aria-label="'删除标签 '+tag" @click="askDeleteTag(tag)"><svg><use href="#trash"/></svg></button></div></div></template></div><div class="empty" x-show="!tagResults.length"><p>没有找到标签</p><button class="secondary" @click="openTagForm()">新建标签</button></div></main>

  <main class="page-body settings" x-show="page==='settings'" x-cloak><p class="section-heading">连接与文件</p><button class="row" @click="navigate('connection')"><svg><use href="#link"/></svg><div class="grow"><h3>服务连接</h3><p x-text="connection.address+':'+connection.port"></p></div><svg class="arrow"><use href="#right"/></svg></button><button class="row" @click="navigate('roots')"><svg><use href="#folder"/></svg><div class="grow"><h3>媒体目录</h3><p><span x-text="roots.length"></span> 个目录 · <span x-text="missingVideos.length"></span> 个缺失视频</p></div><svg class="arrow"><use href="#right"/></svg></button><button class="row" @click="navigate('categories')"><svg><use href="#archive"/></svg><div class="grow"><h3>归档分类</h3><p>分类对应物理目录，标签独立保留</p></div><svg class="arrow"><use href="#right"/></svg></button><p class="section-heading">数据维护</p><button class="row" @click="navigate('trash')"><svg><use href="#trash"/></svg><div class="grow"><h3>回收站</h3><p><span x-text="trashVideos.length"></span> 个视频 · 不会自动清空</p></div><svg class="arrow"><use href="#right"/></svg></button><button class="row" @click="navigate('backup')"><svg><use href="#backup"/></svg><div class="grow"><h3>备份与恢复</h3><p>导出标签、分类和管理记录</p></div><svg class="arrow"><use href="#right"/></svg></button><p class="section-heading">偏好</p><button class="row" @click="openPanel('order')"><svg><use :href="playMode==='random'?'#random':'#sequence'"/></svg><div class="grow"><h3>播放顺序</h3><p x-text="playMode==='random'?'随机播放':'顺序播放'"></p></div><svg class="arrow"><use href="#right"/></svg></button></main>

  <main class="page-body" x-show="page==='connection'" x-cloak><h2 style="margin:12px 0 24px">连接你的视频库</h2><form @submit.prevent="connect()"><label class="field"><span>服务地址</span><input aria-label="服务地址" x-model="connectionForm.address" autocomplete="off" placeholder="192.168.1.20"></label><label class="field"><span>端口</span><input aria-label="端口" x-model="connectionForm.port" inputmode="numeric"></label><label class="field"><span>个人口令</span><input aria-label="个人口令" type="password" x-model="connectionForm.passphrase" autocomplete="off"></label><button class="primary full-width" type="submit" :disabled="busy" style="margin-top:17px" x-text="busy?'正在连接…':'连接'"></button></form></main>

  <main class="page-body" x-show="page==='roots'" x-cloak><div class="toolbar"><p>扫描包含子目录</p><button class="text-button" @click="openRoot()">添加目录</button></div><template x-for="root in roots" :key="root.id"><div class="row"><svg><use href="#folder"/></svg><div class="grow"><h3 x-text="root.name"></h3><p x-text="root.path"></p><span class="status" :class="{'bad':root.status!=='available'}" x-text="root.status==='available'?'可访问 · '+root.lastScan:'目录暂不可用'"></span></div><div class="row-actions"><button :aria-label="'编辑目录 '+root.name" @click="openRoot(root)"><svg><use href="#edit"/></svg></button></div></div></template><button class="secondary full-width" style="margin-top:22px" :disabled="busy" @click="scan()"><svg><use href="#refresh"/></svg><span x-text="busy?'正在扫描…':'刷新媒体目录'"></span></button><div class="missing-list" x-show="missingVideos.length"><h2>缺失视频</h2><p class="minor-note">保留标签记录，重新找到文件后可继续关联。</p><template x-for="v in missingVideos" :key="v.id"><div class="row"><div class="grow"><h3 x-text="v.name"></h3><p x-text="v.path"></p><p x-text="v.tags.join(' · ')"></p></div><span class="status bad">缺失</span></div></template></div></main>

  <main class="page-body" x-show="page==='categories'" x-cloak><div class="toolbar"><p>只有主动归档才移动文件</p><button class="text-button" @click="openCategory()">新建分类</button></div><template x-for="category in categories" :key="category.id"><div class="row"><svg><use href="#archive"/></svg><div class="grow"><h3 x-text="category.name"></h3><p x-text="category.path"></p></div><div class="row-actions"><button :aria-label="'编辑分类 '+category.name" @click="openCategory(category)"><svg><use href="#edit"/></svg></button></div></div></template><p class="minor-note" style="margin-top:23px">标签用于筛选，归档分类决定物理位置。修改分类配置不会移动现有视频。</p></main>

  <main class="page-body" x-show="page==='trash'" x-cloak><div class="toolbar"><p><span x-text="trashVideos.length"></span> 个视频</p><button class="text-button" x-show="trashVideos.length" @click="selected=selected.length===trashVideos.length?[]:trashVideos.map(v=>v.id)" x-text="selected.length===trashVideos.length?'取消全选':'全选'"></button></div><template x-for="v in trashVideos" :key="v.id"><label class="row"><input class="trash-check" type="checkbox" :checked="selected.includes(v.id)" @change="select(v.id)" :aria-label="'选择回收站视频 '+v.name"><img class="row-thumb" :src="poster(v)" :alt="v.name"><div class="grow"><h3 x-text="v.name"></h3><p x-text="v.tags.join(' · ')"></p><p x-text="v.originalPath||v.path"></p></div></label></template><div class="empty" x-show="!trashVideos.length"><svg><use href="#trash"/></svg><p>回收站是空的</p></div></main>

  <main class="page-body" x-show="page==='backup'" x-cloak><section class="backup-block"><h2>留住整理成果</h2><p class="minor-note">备份包含标签、关联、分类与目录映射，不包含原视频和个人口令。</p><button class="primary" @click="exportBackup()"><svg><use href="#backup"/></svg>导出备份</button></section><section class="backup-block"><h2>从备份恢复</h2><p class="minor-note">完整恢复会替换现有管理数据。无法找回已永久删除的视频，也不会撤回已完成的文件移动。</p><label class="file-label" for="backup-file">选择备份文件</label><input class="file-input" type="file" id="backup-file" accept=".json,application/json" @change="importBackup($event)"></section></main>

  <div class="batchbar" x-show="page==='library'&&selected.length" x-cloak><strong x-text="'已选 '+selected.length"></strong><button @click="openTagEditor()">打标签</button><button @click="openArchive()">归档</button><button class="danger" :disabled="busy" @click="removeVideo([...selected])">移入回收站</button></div>
  <div class="batchbar" x-show="page==='trash'&&selected.length" x-cloak><strong x-text="'已选 '+selected.length"></strong><button @click="restore([...selected])">恢复</button><button class="danger" @click="askPermanent()">永久删除</button></div>
  <footer x-show="connection.connected"><nav aria-label="主导航"><template x-for="(item,i) in [{page:'browse',name:'浏览',icon:'browse'},{page:'library',name:'视频库',icon:'grid'},{page:'tags',name:'标签',icon:'tag'},{page:'settings',name:'设置',icon:'settings'}]" :key="item.page"><button :class="{'selected':page===item.page||(!mainPage&&item.page==='settings')}" :aria-current="page===item.page?'page':null" @click="navigate(item.page)"><svg><use :href="'#'+item.icon"/></svg><span x-text="item.name"></span></button></template><div class="nav-selected" :style="'left:'+([ 'browse','library','tags','settings'].includes(page)?['browse','library','tags','settings'].indexOf(page):3)*78+'px; margin-left:22px'"></div></nav><div class="home-indicator"></div></footer>

  <button class="menu-dismiss" x-show="menu" @click="menu=false" aria-label="关闭菜单" x-cloak></button><div class="menu" role="menu" aria-label="更多操作" x-show="menu" x-transition:enter="menu-enter" x-transition:enter-start="menu-start" x-cloak><template x-if="page==='browse'&&current"><div><button role="menuitem" @click="openTagEditor()"><svg><use href="#tag"/></svg>打标签</button><button role="menuitem" @click="openArchive()"><svg><use href="#archive"/></svg>归档</button><button role="menuitem" @click="openPanel('details')"><svg><use href="#info"/></svg>视频详情</button><button role="menuitem" @click="cleanup=!cleanup;menu=false"><svg><use :href="cleanup?'#browse':'#trash'"/></svg><span x-text="cleanup?'返回日常浏览':'进入整理模式'"></span></button><button role="menuitem" @click="menu=false;newRound()"><svg><use href="#refresh"/></svg>开始新一轮</button><button class="danger" role="menuitem" :disabled="busy" @click="removeVideo([current.id])"><svg><use href="#trash"/></svg>移入回收站</button></div></template><template x-if="page!=='browse'||!current"><div><button role="menuitem" @click="navigate('roots')"><svg><use href="#folder"/></svg>媒体目录</button><button role="menuitem" @click="navigate('trash')"><svg><use href="#trash"/></svg>回收站</button><button role="menuitem" @click="navigate('backup')"><svg><use href="#backup"/></svg>备份与恢复</button></div></template></div>

  <div class="backdrop" x-show="panel" @click="if(!busy)closePanel()" x-cloak></div>
  <section class="sheet" role="dialog" aria-modal="true" :aria-label="({folders:'选择文件夹',order:'播放模式','tag-edit':'打标签','tag-form':editId?'重命名标签':'新建标签',confirm:confirmTitle,archive:'选择归档分类','archive-preview':'归档预览',details:'视频详情',attributes:'属性筛选','root-form':'媒体目录','category-form':'归档分类',restore:'恢复备份'})[panel]" x-show="panel" @keydown.tab="trapFocus($event)" x-transition:enter="sheet-enter" x-transition:enter-start="sheet-start" x-cloak>
  <div class="sheet-header"><h2 x-text="({folders:'选择文件夹',order:'播放模式','tag-edit':'打标签','tag-form':editId?'重命名标签':'新建标签',confirm:confirmTitle,archive:'选择归档分类','archive-preview':'归档预览',details:'视频详情',attributes:'属性筛选','root-form':editId?'编辑媒体目录':'添加媒体目录','category-form':editId?'编辑归档分类':'新建归档分类',restore:'恢复备份'})[panel]"></h2><button class="close" aria-label="关闭面板" :disabled="busy" @click="closePanel()"><svg><use href="#close"/></svg></button></div>
  <div class="sheet-body">
    <template x-if="panel==='folders'"><div><div class="crumbs"><button @click="folderCursor='';formError=''">媒体目录</button><template x-for="crumb in breadcrumbs" :key="crumb.path"><button @click="folderCursor=crumb.path;formError=''"><svg><use href="#right"/></svg><span x-text="crumb.name"></span></button></template></div><div class="scope-current" x-text="folderCursor||'全部媒体目录'"></div><template x-for="node in folderChildren" :key="node.path"><button class="folder-row" :class="{'unavailable':node.unavailable}" :data-path="node.path" @click="enterFolder(node)"><svg><use href="#folder"/></svg><div class="grow"><p x-text="node.name"></p><small x-text="node.unavailable?'暂不可用':folderCount(node.path)+' 个视频 · 包含子目录'"></small></div><svg><use href="#right"/></svg></button></template><p class="minor-note" x-show="folderCursor&&!folderChildren.length">这个目录没有下级文件夹。</p><div class="sheet-actions"><button class="primary" @click="useFolder()" x-text="folderCursor?'使用此目录':'使用全部目录'"></button></div></div></template>
    <template x-if="panel==='order'"><div><button class="choice-row" @click="setMode('random')"><svg><use href="#random"/></svg><div><p>随机播放</p><small>一轮向前浏览不重复，允许回看</small></div><svg x-show="playMode==='random'"><use href="#check"/></svg></button><button class="choice-row" @click="setMode('sequence')"><svg><use href="#sequence"/></svg><div><p>顺序播放</p><small>按目录和文件名顺序浏览</small></div><svg x-show="playMode==='sequence'"><use href="#check"/></svg></button><p class="minor-note" style="margin-top:15px">切换模式会从当前目录与标签范围开始新一轮。</p></div></template>
    <template x-if="panel==='tag-edit'"><div><p class="minor-note" x-text="editIds.length===1?'编辑当前视频的标签':'将修改 '+editIds.length+' 个视频，其他标签保持不变'"></p><div x-show="editIds.length>1" class="options"><button :class="{'chosen':batchAction==='add'}" @click="batchAction='add'">添加标签</button><button :class="{'chosen':batchAction==='remove'}" @click="batchAction='remove'">移除标签</button></div><div class="options"><template x-for="tag in tags" :key="tag"><button :aria-pressed="draftTags.includes(tag)" :class="{'chosen':draftTags.includes(tag)}" @click="draftTags.includes(tag)?draftTags=draftTags.filter(t=>t!==tag):draftTags.push(tag)" x-text="tag"></button></template></div><div class="sheet-actions"><button class="primary" @click="saveTags()">完成</button></div></div></template>
    <template x-if="panel==='tag-form'"><form @submit.prevent="saveTag()"><label class="field"><span>标签名称</span><input x-model="form.name" aria-label="标签名称" maxlength="40"></label><div class="sheet-actions"><button type="submit" class="primary">保存</button></div></form></template>
    <template x-if="panel==='attributes'"><div><label class="field"><span>画面方向</span><select x-model="draftAttrs.orientation" aria-label="画面方向"><option value="">全部方向</option value="portrait">竖版</option><option value="landscape">横版</option></select></label><label class="field"><span>时长</span><select x-model="draftAttrs.duration" aria-label="时长"><option value="">全部时长</option><option value="short">10 秒以内</option><option value="long">10 秒以上</option></select></label><label class="field"><span>文件类型</span><select x-model="draftAttrs.type" aria-label="文件类型"><option value="">全部类型</option><option value="MP4">MP4</option></select></label><div class="sheet-actions spread"><button class="text-button" @click="draftAttrs={orientation:'',duration:'',type:''}">清除属性</button><button class="primary" @click="setFilters(filters,draftAttrs);closePanel()">应用</button></div></div></template>
    <template x-if="panel==='details'"><div><p style="font-size:16px;line-height:1.7;overflow-wrap:anywhere" x-text="current?.name"></p><p class="minor-note" x-text="(current?.orientation==='landscape'?'横版':'竖版')+' · '+format(current?.duration)+' · MP4'"></p><p class="path" x-text="current?.path"></p><p class="minor-note" x-text="current?categoryName(current):''"></p></div></template>
    <template x-if="panel==='archive'"><div><p class="minor-note" x-text="'归档 '+archiveItems.length+' 个视频，先预览再执行'"></p><template x-for="category in categories" :key="category.id"><label class="row"><input type="radio" name="archive-category" :value="category.id" x-model="archiveCategory"><div class="grow"><h3 x-text="category.name"></h3><p x-text="category.path"></p></div></label></template><div class="sheet-actions"><button class="primary" @click="buildPreview()">预览移动</button></div></div></template>
    <template x-if="panel==='archive-preview'"><div><p class="minor-note">尚未移动文件。执行时会再次检查来源与目标。</p><template x-for="item in preview" :key="item.id"><div class="preview-item"><h3 x-text="item.name"></h3><p class="path" x-text="item.source"></p><svg class="preview-arrow"><use href="#right"/></svg><p class="path" x-text="item.target"></p><span class="status bad" x-show="item.conflict">同名冲突，不会覆盖</span></div></template><div class="sheet-actions"><button class="secondary" @click="panel='archive';formError=''">修改目标</button><button class="primary" :disabled="busy||preview.some(p=>p.conflict)" @click="executeArchive()" x-text="busy?'正在移动…':'执行归档'"></button></div></div></template>
    <template x-if="panel==='root-form'||panel==='category-form'"><form @submit.prevent="panel==='root-form'?saveRoot():saveCategory()"><label class="field"><span>名称</span><input x-model="form.name" aria-label="名称" maxlength="40"></label><label class="field"><span x-text="panel==='root-form'?'挂载目录':'目标目录'"></span><input x-model="form.path" aria-label="目录路径" spellcheck="false"></label><p class="minor-note" x-text="panel==='root-form'?'扫描包含子目录，不修改源文件位置。':'只保存分类映射，不会移动文件。'"></p><div class="sheet-actions"><button type="submit" class="primary">保存</button></div></form></template>
    <template x-if="panel==='confirm'"><div><p class="minor-note" x-text="confirmText"></p><div class="sheet-actions"><button class="secondary" @click="closePanel()">取消</button><button class="danger-button" @click="confirm()" x-text="confirmKind==='permanent'?'永久删除':confirmKind==='reset'?'重置数据':'删除标签'"></button></div></div></template>
    <template x-if="panel==='restore'"><div><p class="minor-note">校验通过。恢复前保留现有数据快照，请核对媒体目录映射。</p><template x-for="mapping in restoreMaps" :key="mapping.id"><label class="field"><span x-text="mapping.from"></span><input x-model="mapping.to" :aria-label="'恢复目录 '+mapping.from"></label></template><label class="checkline"><input type="checkbox" x-model="restoreChecked" aria-label="确认替换现有管理数据"><span>我知道恢复会替换现有管理数据，原视频不会从备份中恢复。</span></label><div class="sheet-actions"><button class="secondary" :disabled="busy" @click="closePanel()">取消</button><button class="primary" :disabled="busy" @click="restoreBackup()" x-text="busy?'正在恢复…':'恢复管理数据'"></button></div></div></template>
    <p class="inline-error" x-show="formError" role="alert" x-text="formError"></p>
  </div></section>
  <div class="notice" role="status" x-show="notice" x-cloak><span x-text="notice"></span><button x-show="notice==='已移入回收站'&&lastDelete" @click="undo()">撤销</button></div>
</div></body></html>
