<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设计参考 LF-2026-10-23 · 留白</title><link rel="stylesheet" href="style.css"><script defer src="runtime/prototype.js"></script><script defer src="vendor/alpine.min.js"></script></head><body><main class="app" x-data="libraryApp()" :class="{dark:devicePrefs.dark}" @keydown.window="key($event)" x-cloak>
<template x-if="screen==='home'"><div style="display:contents">
<header class="topbar"><button class="icon" x-show="fromTags&&tab==='library'" aria-label="返回标签选择" @click="tab='tags';fromTags=false" x-html="icon('back')"></button><h1 x-text="title"></h1><span class="spacer"></span><button class="icon" x-show="tab==='library'" aria-label="选择目录范围" @click="panel='folder'" x-html="icon('folder')"></button><button class="icon plus" x-show="tab==='tags'" :aria-label="'新建'+typeName+'标签'" @click="createName='';panel='create'">＋</button><button class="icon" x-show="tab==='library'" :aria-label="multi?'结束多选':'多选内容'" @click="multi=!multi;chosen=[]" x-html="icon(multi?'check':'more')"></button></header>
<div class="kindbar" x-show="tab!=='settings'"><button :class="{active:kind==='video'}" @click="setKind('video')" aria-label="视频分类">视频 <span class="type-count" x-show="tab==='library'" x-text="available.filter(i=>i.type==='video').length"></span></button><button :class="{active:kind==='pack'}" @click="setKind('pack')" aria-label="图包分类">图包 <span class="type-count" x-show="tab==='library'" x-text="available.filter(i=>i.type==='pack').length"></span></button></div>
<template x-if="tab==='library'"><div style="display:contents">
<div class="search-row"><button class="icon filter-trigger" @click="panel='filter'" :class="{active:hasScope}" aria-label="筛选" x-html="icon('filter')"></button><span class="search-symbol" x-html="icon('search')"></span><input type="search" aria-label="搜索当前媒体库" x-model="search" :placeholder="kind==='video'?'搜索视频名称、目录':'搜索图包、作者、目录'"></div>
<section class="library" x-ref="library" aria-label="媒体库内容">
<template x-if="kind==='pack'&&continuePack&&!hasScope&&!multi"><button class="continue" @click="openPack(continuePack.id)"><img :src="continuePack.cover" alt=""><span class="grow"><span class="small muted">继续阅读</span><h2 x-text="continuePack.title"></h2><span class="small muted" x-text="'第 '+((progress[continuePack.id]??0)+1)+' / '+continuePack.pages.length+' 张'"></span><span class="progress-line"><i :style="'width:'+(((progress[continuePack.id]??0)+1)/continuePack.pages.length*100)+'%'"></i></span></span><span x-html="icon('next')"></span></button></template>
<div class="scope scope-summary" x-show="hasScope"><span class="grow" x-text="scopeLabel"></span><button aria-label="清除当前筛选" @click="clearScope()">清除</button></div>
<div class="library-toolbar"><span class="result-count" x-text="filteredItems.length+' '+itemUnit"></span><button class="text-button" x-show="kind==='pack'" @click="statusFilter=statusFilter==='全部'?'未读':statusFilter==='未读'?'在读':statusFilter==='在读'?'已读':'全部'" x-text="statusFilter==='全部'?'阅读状态':statusFilter"></button><button class="text-button sort" @click="sort=sort==='名称'?'最近加入':'名称'" x-text="sort+' ↓'"></button><button class="text-button" x-show="kind==='pack'&&!multi" :disabled="!filteredItems.length" @click="startPackQuick()">快速整理</button><button class="primary" x-show="kind==='video'&&!multi" :disabled="!filteredItems.length" @click="startVideo()"><span x-html="icon('play')"></span>预览此范围</button></div>
<div class="grid"><template x-for="i in filteredItems" :key="i.id"><article class="tile" :data-item="i.id"><button class="check-circle" :class="{on:chosen.includes(i.id)}" x-show="multi" @click="selectPack(i.id)" :aria-label="'选择 '+i.title" :aria-pressed="chosen.includes(i.id)"><span x-show="chosen.includes(i.id)" x-html="icon('check')"></span></button><button class="tile-cover" :class="{'video-cover':i.type==='video'}" @click="openItem(i)" :aria-label="(i.type==='video'?'预览 ':'阅读 ')+i.title"><img :src="i.cover" :alt="i.title" loading="lazy"><span class="page-badge" x-text="i.type==='pack'?i.pages.length+' 张':i.duration"></span><span class="reading-badge" x-show="i.type==='pack'&&progress[i.id]!==undefined&&!multi" x-text="progress[i.id]>=i.pages?.length-1?'已读':'在读 · '+(progress[i.id]+1)"></span><span class="tile-play" x-show="i.type==='video'" x-html="icon('play')"></span></button><h3 x-text="i.title"></h3><div class="meta"><span x-text="i.type==='video'?i.folder.split(' / ').at(-1):i.author"></span><button class="icon mini" :aria-label="(i.type==='pack'?'图包操作 ':'编辑标签 ')+i.title" @click="i.type==='pack'?openPackActions(i.id):(chosen=[],editTags(i.id))" x-html="icon('more')"></button></div><div class="mini-tag" x-text="i.tags.map(t=>'# '+t).join('  ')"></div></article></template></div>
<div class="empty" x-show="!filteredItems.length"><span x-html="icon('search')"></span><h2>没有符合条件的内容</h2><p>可以减少标签或调整目录范围。</p><button class="secondary" @click="clearScope()">清除筛选</button></div>
</section><div class="batch" x-show="multi"><span x-text="'已选 '+chosen.length+' '+itemUnit"></span><button class="text-button" @click="chosen=filteredItems.map(i=>i.id)">全选</button><button class="primary" :disabled="!chosen.length" @click="editTags()">批量标签</button></div>
</div></template>
<template x-if="tab==='tags'"><div style="display:contents"><section class="simple-page tags-page"><div class="tag-heading"><h2 x-text="typeName+'标签'"></h2><p x-text="kind==='video'?'选择一个或多个标签，确定视频预览范围。':'选择一个或多个标签，找到整包图片。'"></p><input class="tag-input tag-search" type="search" aria-label="搜索当前类型标签" placeholder="搜索标签" x-model="tagSearchByKind[kind]"></div><template x-for="t in visibleCatalog" :key="kind+'-'+t"><div class="tag-row"><button @click="toggleTagSelection(t)" :aria-label="'筛选标签 '+t" :aria-pressed="tagSelection.includes(t)"><span class="tag-check" :class="{on:tagSelection.includes(t)}"><span x-show="tagSelection.includes(t)" x-html="icon('check')"></span></span><span class="grow"><h3 x-text="t"></h3><p x-text="tagCount(t)+' '+itemUnit"></p></span></button><button class="icon" :aria-label="'管理标签 '+t" @click="manageTag(t)" x-html="icon('more')"></button></div></template><div class="empty" x-show="!visibleCatalog.length"><p x-text="tagSearchByKind[kind]?'没有匹配的标签':'还没有'+typeName+'标签'"></p><button class="text-button" @click="createName='';panel='create'">新建标签</button></div></section>
<div class="tag-dock"><div><span x-text="tagSelection.length?'同时包含 '+tagSelection.length+' 个标签':'全部'+typeName"></span><button class="text-button" x-show="tagSelection.length" @click="tagSelection=[]">清除选择</button></div><div class="tag-match"><strong x-text="'匹配 '+tagResults.length+' '+itemUnit"></strong><button class="text-button" x-show="kind==='video'" @click="showTagResults()">查看结果 →</button></div><button class="primary wide" :disabled="!tagResults.length" @click="kind==='video'?previewTags():showTagResults()" x-text="kind==='video'?'预览这 '+tagResults.length+' 个视频':'查看 '+tagResults.length+' 个图包'"></button></div>
</div></template>
<section class="simple-page" x-show="tab==='recent'"><div class="section-label" x-text="kind==='video'?'最近预览的视频':'最近阅读的图包'"></div><template x-for="i in recentItems"><button class="history-item" @click="openItem(i)"><img :src="i.cover" alt=""><span class="grow"><h2 x-text="i.title"></h2><p x-text="i.type==='pack'?'第 '+((progress[i.id]??0)+1)+' / '+i.pages.length+' 张':i.duration"></p></span><span x-html="icon('next')"></span></button></template><p class="empty" x-show="!recentItems.length">还没有观看记录</p></section>
<section class="simple-page settings-page" x-show="tab==='settings'">
<p class="settings-group">连接与文件</p>
<button class="row" @click="openSettings('connection')"><span class="setting-icon" x-html="icon('link')"></span><span class="grow"><h3>服务连接</h3><p x-text="connection"></p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('roots')"><span class="setting-icon" x-html="icon('folder')"></span><span class="grow"><h3>媒体目录</h3><p x-text="rootDefs.length+' 个目录 · '+missingRecords.length+' 个缺失内容'"></p></span><span x-html="icon('next')"></span></button>
<p class="settings-group">数据维护</p>
<button class="row" @click="openSettings('trash')"><span class="setting-icon" x-html="icon('trash')"></span><span class="grow"><h3>回收站</h3><p x-text="trashIds.length+' 个内容 · 不会自动清空'"></p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('backup')"><span class="setting-icon" x-html="icon('backup')"></span><span class="grow"><h3>备份与恢复</h3><p>标签、目录映射、回收站与阅读记录</p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('tasks')"><span class="setting-icon" x-html="icon('history')"></span><span class="grow"><h3>操作任务</h3><p x-text="pendingJobs?pendingJobs+' 项结果待确认':'扫描、恢复与删除结果'"></p></span><span class="task-dot" x-show="pendingJobs"></span><span x-html="icon('next')"></span></button>
<p class="settings-group">偏好</p>
<label class="row preference-toggle"><span class="setting-icon" x-html="icon('moon')"></span><span class="grow"><h3>暗黑模式</h3></span><input type="checkbox" role="switch" aria-label="暗黑模式" :checked="devicePrefs.dark" @change="setDevicePreference('dark',$event.target.checked)"></label>
<label class="row preference-toggle"><span class="setting-icon" x-html="icon('play')"></span><span class="grow"><h3>准备相邻视频</h3><p>最多前后各一条，关闭可减少网络和解码占用</p></span><input type="checkbox" role="switch" aria-label="准备相邻视频" :checked="devicePrefs.preload" @change="setDevicePreference('preload',$event.target.checked)"></label>
<button class="row" @click="openSettings('playback')"><span class="setting-icon" x-html="icon('shuffle')"></span><span class="grow"><h3>播放顺序</h3><p x-text="defaultOrder+'播放 · 新预览范围使用'"></p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('defaults')"><span class="setting-icon" x-html="icon('book')"></span><span class="grow"><h3>阅读偏好</h3><p x-text="'默认'+(defaultMode==='horizontal'?'横向翻页':'纵向拼接')+' · 每包单独记忆'"></p></span><span x-html="icon('next')"></span></button>
</section>

<nav class="nav" aria-label="主导航"><template x-for="n in navItems"><button :class="{active:activeNav===n[0]}" @click="nav(n[0])" :aria-label="n[1]"><span x-html="icon(n[2])"></span><span x-text="n[1]"></span></button></template></nav></div></template>
<template x-if="screen==='video'"><section class="video-full"><header class="topbar"><button class="icon" aria-label="返回来源" @click="closeContent()" x-html="icon('back')"></button><h2>视频预览</h2><span class="spacer"></span><button class="icon" aria-label="视频操作" @click="panel='videoMore'" x-html="icon('more')"></button></header><button class="preview-scope" @click="panel='queue'" aria-label="查看本次预览范围"><span x-text="queueLabel"></span><strong x-text="(queueAt+1)+' / '+queueIds.length"></strong><span x-html="icon('grid')"></span></button>
<div class="video-stage" @pointerdown="videoGesture=$event.clientY" @pointerup="videoSwipe($event)"><video :src="video.src" :poster="video.cover" playsinline preload="metadata" @loadedmetadata="videoDuration=$event.target.duration;videoTime=0;$event.target.playbackRate=videoSpeed" @timeupdate="videoTime=$event.target.currentTime" @play="videoPlaying=true" @pause="videoPlaying=false" @ended="videoPlaying=false" @error="videoError=true" @click="videoControls=!videoControls" aria-label="视频播放器"></video><button class="video-play" x-show="!videoPlaying" @click="toggleVideo()" aria-label="播放视频" x-html="icon('play')"></button><div class="video-seek" x-show="videoControls"><button @click="toggleVideo()" :aria-label="videoPlaying?'暂停视频':'播放视频'" x-text="videoPlaying?'暂停':'播放'"></button><input type="range" min="0" :max="videoDuration||1" step="0.1" :value="videoTime" @input="document.querySelector('video').currentTime=Number($event.target.value)" aria-label="视频进度"><span x-text="fmt(videoTime)+' / '+fmt(videoDuration)"></span><select x-model.number="videoSpeed" @change="document.querySelector('video').playbackRate=videoSpeed" aria-label="播放速度"><option :value="1">1×</option><option :value="1.5">1.5×</option><option :value="2">2×</option></select></div><button class="video-wide secondary" x-show="video.id==='v-landscape'||videoFull" @click="toggleVideoFull()" :aria-label="videoFull?'退出全屏':'横向全屏'"><span x-html="icon('expand')"></span><span x-text="videoFull?'退出全屏':'横向全屏'"></span></button><div class="video-fail" x-show="videoError"><p>视频暂时无法播放</p><button class="secondary" @click="videoError=false;document.querySelector('video').load()">重新加载</button></div></div>
<div class="viewer-tools"><button @click="panel='queue'"><span x-html="icon('shuffle')"></span><span x-text="queueOrder+'预览'"></span></button><button @click="editTags(video.id)"><span x-html="icon('tag')"></span>视频标签</button><button :class="{active:quick}" @click="quick=!quick"><span x-html="icon('filter')"></span>快速整理</button></div><div class="cleanup" x-show="quick"><span>快速整理</span><button @click="editTags(video.id)">打标签</button><button class="danger" @click="askDelete(video.id)">移入回收站</button></div><div class="preview-bottom"><button :disabled="queueAt===0" @click="stepVideo(-1)" aria-label="上一个视频"><span x-html="icon('up')"></span>上一条</button><span x-text="queueAt===queueIds.length-1?'本次范围最后一条':'上下滑动切换'"></span><button @click="stepVideo(1)" aria-label="下一个视频"><span x-text="queueAt===queueIds.length-1?'结束':'下一条'"></span><span x-html="icon('down')"></span></button></div></section></template>
<template x-if="screen==='reader'"><section class="reader" :class="{immersive:!controls&&!packQuick, 'pack-quick':packQuick}" aria-label="图包阅读器">
  <header class="reader-top"><button class="icon" aria-label="返回来源" @click="closeReader()" x-html="icon('back')"></button><div class="grow"><h2 x-text="pack.title"></h2><p x-text="(packQuick?'快速整理 · ':'')+pack.author+' · '+pack.number"></p></div><button class="text-button quick-done" x-show="packQuick" @click="packQuick=false">完成</button><button class="icon" x-show="!packQuick" aria-label="阅读设置" @click="panel='reader-settings'" x-html="icon('settings')"></button><button class="icon" aria-label="图包更多" @click="panel='pack-more'" x-html="icon('more')"></button></header>
  <div class="reader-content">
   <template x-if="mode==='horizontal'"><div class="paged" :class="{zoom}" @pointerdown="startGesture($event)" @pointerup="endGesture($event)" @dblclick.prevent="zoom=!zoom;controls=true"><img :src="pack.pages[page]" :alt="pack.title+' 第 '+(page+1)+' 张'" @error="failedImage=true" :style="fit==='width'&&!zoom?'height:auto;min-height:100%;object-fit:contain':''" draggable="false"></div></template>
   <template x-if="mode==='vertical'"><div class="reader-scroll" x-ref="strip" @scroll.throttle.80ms="onScroll()"><template x-for="(src,i) in pack.pages" :key="pack.id+'-'+i"><div class="strip-page" :class="{gap}" :data-page="i"><img :src="src" :width="pack.sizes[i][0]" :height="pack.sizes[i][1]" :alt="pack.title+' 第 '+(i+1)+' 张'" :loading="Math.abs(i-page)<=1?'eager':'lazy'" @click="controls=!controls"><span class="page-no" x-text="i+1"></span></div></template><div class="strip-end"><p>已到本包末尾</p><button class="primary" x-show="nextPack" @click="movePack(1)">阅读下一包</button><button class="text-button" @click="closeReader()">返回来源</button></div></div></template>
   <button class="strip-toggle" x-show="mode==='vertical'&&!controls" aria-label="显示阅读工具" @click="controls=true" x-html="icon('more')"></button>
   <div class="reader-empty" x-show="failedImage"><p>这一张暂时无法载入</p><button class="secondary" @click="pack.pages[page]=pack.pages[page].split('?')[0]+'?retry='+Date.now();failedImage=false">重试</button><button class="text-button" @click="advance(1)">跳过这一张</button></div>
  </div>
  <div class="reader-bottom"><div class="reader-progress"><button class="icon" aria-label="上一张" @click="advance(-1)" :disabled="page===0" x-html="icon('back')"></button><input class="range" type="range" min="0" :max="pageCount-1" :value="page" @input="jump($event.target.value)" aria-label="阅读页码"><span x-text="(page+1)+' / '+pageCount"></span><button class="icon" aria-label="下一张" @click="advance(1)" x-html="icon('next')"></button></div>
   <div class="reader-tools" x-show="!packQuick"><button @click="panel='overview'" aria-label="页码总览"><span x-html="icon('grid')"></span><span>总览</span></button><button @click="panel='reader-settings'"><span x-html="icon(mode==='vertical'?'vertical':'horizontal')"></span><span x-text="mode==='vertical'?'纵向拼接':'横向翻页'"></span></button><button @click="chosen=[];editTags(pack.id)" aria-label="整包标签"><span x-html="icon('tag')"></span><span>整包标签</span></button><button @click="controls=false" aria-label="沉浸阅读"><span x-html="icon('expand')"></span><span>沉浸</span></button></div>
   <div class="pack-cleanup" x-show="packQuick" aria-label="图包快速整理"><button class="secondary" @click="editTags(pack.id)">整包标签</button><button class="primary danger-bg" @click="removePackNow()" aria-label="移除当前整包">移入回收站</button></div><div class="reading-context"><button class="pack-previous" x-show="packQuick" :disabled="queueAt===0" @click="movePack(-1)" aria-label="上一个图包"><span x-html="icon('back')"></span>上一包</button><button class="reader-scope" aria-label="查看本次图包范围" @click="panel='packScope'"><span x-text="queueLabel"></span><strong x-text="(queueAt+1)+' / '+queueIds.length"></strong></button><button @click="movePack(1)" x-show="nextPack">下一包 <span x-html="icon('next')"></span></button></div>
  </div><span class="immersive-page" x-show="!controls&&!packQuick" x-text="(page+1)+' / '+pageCount"></span>
 </section></template>
<div class="scrim" x-show="panel" @click.self="panel=''" x-cloak><section class="sheet" :class="{management:managementPanel}" tabindex="-1" x-ref="sheet" role="dialog" aria-modal="true" :aria-label="sheetTitle"><header class="sheet-head"><h2 x-text="sheetTitle"></h2><button class="icon" aria-label="关闭面板" @click="panel=''" x-html="icon('close')"></button></header><div class="sheet-body">
<template x-if="panel==='reader-settings'"><div><p class="sheet-sub" x-text="pack.title+' · 记住本包的阅读方式'"></p><div class="mode-options"><button class="mode-option" :class="{active:mode==='horizontal'}" @click="changeMode('horizontal')"><span x-html="icon('horizontal')"></span>横向翻页</button><button class="mode-option" :class="{active:mode==='vertical'}" @click="changeMode('vertical')"><span x-html="icon('vertical')"></span>纵向拼接</button></div><div class="setting-row" x-show="mode==='horizontal'"><span>翻页方向</span><select aria-label="翻页方向" x-model="direction" @change="changeMode(mode)"><option value="ltr">从左向右</option><option value="rtl">从右向左</option></select></div><div class="setting-row" x-show="mode==='horizontal'"><span>图片适配</span><select x-model="fit" aria-label="图片适配"><option value="contain">完整显示</option><option value="width">铺满画面</option></select></div><label class="setting-row" x-show="mode==='vertical'"><span>图片之间留间距</span><input type="checkbox" x-model="gap" @change="changeMode(mode)"></label><p class="sheet-sub" style="margin:18px 0 0" x-text="mode==='horizontal'?'左右滑动翻页，轻点中间收起工具。双击图片可放大，再次双击复原。':'上下滑动连续阅读，轻点图片收起工具。切换模式仍停在当前图片。'"></p></div></template>
<template x-if="panel==='overview'"><div><p class="sheet-sub" x-text="pack.title+' · '+pageCount+' 张 · 文件名自然顺序'"></p><div class="page-grid"><template x-for="(src,i) in pack.pages"><button :class="{active:page===i}" @click="jump(i);panel=''" :aria-label="'跳到第 '+(i+1)+' 张'"><img :src="src" alt="" loading="lazy"><span x-text="i+1"></span></button></template></div></div></template>
<template x-if="panel==='details'"><div><img class="detail-image" :src="pack.pages[0]" alt=""><h2 x-text="pack.title"></h2><p class="sheet-sub" x-text="pack.author+' · '+pageCount+' 张'"></p><h3>原目录</h3><p class="path" x-text="'217 Cos图包 / '+pack.folder"></p><h3>整包标签</h3><p class="text-tags" x-text="pack.tags.join(' · ')"></p><button class="text-button" @click="editTags()">编辑标签</button></div></template>
<template x-if="panel==='connection'"><form @submit.prevent="saveConnection()"><p class="sheet-sub">视频和图包共用同一媒体服务。</p><label class="field-label">服务地址<input class="tag-input" x-model="connectionForm.address" aria-label="服务地址" placeholder="http://nas.local"></label><label class="field-label">端口<input class="tag-input" x-model="connectionForm.port" aria-label="端口" inputmode="numeric"></label><label class="field-label">个人口令<input class="tag-input" x-model="connectionForm.passphrase" aria-label="个人口令" type="password" autocomplete="off" placeholder="输入个人口令"></label><p class="sheet-sub">口令不进入管理数据备份。</p><button class="primary wide" :disabled="connecting" x-text="connecting?'正在连接…':'连接并保存'"></button><p class="inline-status" x-show="connectionStatus" x-text="connectionStatus" role="status"></p></form></template>
<template x-if="panel==='roots'"><div><div class="management-toolbar"><p class="small muted">扫描包含子目录</p><button class="text-button" @click="editRoot()">添加目录</button></div><template x-for="r in rootDefs" :key="r.id"><div class="root-row"><span class="setting-icon" x-html="icon('folder')"></span><span class="grow"><h3 x-text="r.name"></h3><p class="path" x-text="r.path"></p><p class="root-state" :class="{danger:!r.available}" x-text="(r.kind==='video'?'视频':'图包')+' · '+(!r.available?'目录暂时离线':r.enabled?'已启用':'已停用')"></p></span><button class="icon" :aria-label="'编辑目录 '+r.name" @click="editRoot(r)" x-html="icon('edit')"></button></div></template><div class="scan-feedback" x-show="scanStatus"><progress max="100" :value="scanProgress" x-show="scanning"></progress><p x-text="scanStatus"></p></div><button class="secondary wide" style="margin-top:18px" @click="scanRoots()" :disabled="scanning" x-text="scanning?'同步进行中':'同步外部变更'"></button><button class="row" @click="panel='missing'"><span class="grow"><h3>缺失内容</h3><p x-text="missingRecords.length+' 个记录 · 暂时离线目录不作缺失处理'"></p></span><span x-html="icon('next')"></span></button><p class="footnote">图包目录的直属文件夹识别为包，包内递归读取图片；不会改变源文件位置。</p></div></template>
<template x-if="panel==='rootForm'"><form @submit.prevent="saveRoot()"><label class="field-label">名称<input class="tag-input" aria-label="目录名称" x-model="rootDraft.name"></label><label class="field-label">挂载目录<input class="tag-input" aria-label="挂载目录" x-model="rootDraft.path" placeholder="/media/packs"></label><label class="setting-row"><span>内容类型</span><select aria-label="目录内容类型" x-model="rootDraft.kind"><option value="video">视频文件</option><option value="pack">图包文件夹</option></select></label><label class="setting-row"><span>启用目录</span><input type="checkbox" aria-label="启用目录" x-model="rootDraft.enabled"></label><p class="sheet-sub">使用 NAS 服务内的挂载路径。停用只隐藏内容，保留标签和记录。</p><div class="sheet-actions"><button type="button" class="text-button" @click="panel='roots'">取消</button><button class="primary">保存目录</button></div></form></template>
<template x-if="panel==='missing'"><div><p class="sheet-sub">保留标签与进度，重新找到同一内容后继续关联。只清除扫描已确认缺失的记录。</p><div class="empty" x-show="!missingRecords.length">没有缺失内容</div><template x-for="r in missingRecords"><div class="root-row"><span class="grow"><h3 x-text="r.title"></h3><p class="path" x-text="r.path"></p><p class="root-state" x-text="(r.kind==='video'?'视频':'图包')+' · '+r.tags.join(' / ')"></p></span><span class="danger small" x-text="r.offline?'目录离线':'已确认缺失'"></span></div></template><button class="text-button danger wide" x-show="missingRecords.some(r=>!r.offline)" @click="panel='clearMissing'">清除失效记录</button><button class="text-button wide" @click="panel='roots'">返回媒体目录</button></div></template>
<template x-if="panel==='clearMissing'"><div><p class="sheet-sub">仅清除已确认缺失的记录及其标签关联，不删除磁盘文件。暂时离线的目录不会清理；清理后找回内容不会恢复原标签。</p><div class="sheet-actions"><button class="text-button" @click="panel='missing'">取消</button><button class="primary danger-bg" @click="clearMissing()">确认清除记录</button></div></div></template>
<template x-if="panel==='playback'"><div><p class="sheet-sub">用于下次从媒体库或标签进入预览，不打乱正在观看的范围。</p><button class="row" @click="setDefaultOrder('顺序')"><span class="grow"><h3>顺序播放</h3><p>按当前结果列表顺序</p></span><span x-show="defaultOrder==='顺序'" x-html="icon('check')"></span></button><button class="row" @click="setDefaultOrder('随机')"><span class="grow"><h3>随机播放</h3><p>本轮向前不重复，可以回看</p></span><span x-show="defaultOrder==='随机'" x-html="icon('check')"></span></button></div></template>
<template x-if="panel==='defaults'"><div><p class="sheet-sub">首次打开图包时使用。已阅读的图包沿用各自设置。</p><div class="mode-options"><button class="mode-option" :class="{active:defaultMode==='horizontal'}" @click="setDefault('horizontal')"><span x-html="icon('horizontal')"></span>横向翻页</button><button class="mode-option" :class="{active:defaultMode==='vertical'}" @click="setDefault('vertical')"><span x-html="icon('vertical')"></span>纵向拼接</button></div><label class="setting-row"><span>默认翻页方向</span><select aria-label="默认翻页方向" :value="readerDefaults.direction" @change="setReaderDefault('direction',$event.target.value)"><option value="ltr">从左向右</option><option value="rtl">从右向左</option></select></label><label class="setting-row"><span>纵向图片间距</span><input type="checkbox" aria-label="默认图片间距" :checked="readerDefaults.gap" @change="setReaderDefault('gap',$event.target.checked)"></label><p class="footnote">页码、方向与间距随图包保存。</p></div></template>
<template x-if="panel==='trash'"><div><div class="kindbar" style="padding:0"><button :class="{active:trashKind==='video'}" @click="trashKind='video';trashChosen=[]">视频</button><button :class="{active:trashKind==='pack'}" @click="trashKind='pack';trashChosen=[]">图包</button></div><p class="sheet-sub">只作标记，源文件仍在原位置。恢复保留标签和进度；不会自动清空。</p><div class="management-toolbar"><span class="small muted" x-text="trashItems.length+' 个'+(trashKind==='video'?'视频':'图包')"></span><button class="text-button" @click="trashChosen=trashChosen.length===trashItems.length?[]:trashItems.map(i=>i.id)" x-show="trashItems.length" x-text="trashChosen.length===trashItems.length?'取消全选':'全选'"></button></div><template x-for="i in trashItems" :key="i.id"><div class="trash-row"><input type="checkbox" :aria-label="'选择回收内容 '+i.title" :checked="trashChosen.includes(i.id)" @change="toggleTrash(i.id)"><span class="grow"><h3 x-text="i.title"></h3><p class="path" x-text="i.folder"></p></span><button class="text-button" @click="restore(i.id)">恢复</button></div></template><div class="empty" x-show="!trashItems.length">这个分类的回收站为空</div><div class="management-actions" x-show="trashItems.length"><span class="small" x-text="'已选 '+trashChosen.length"></span><button class="secondary" :disabled="!trashChosen.length" @click="restoreTrashSelection()">恢复所选</button><button class="text-button danger" :disabled="!trashChosen.length" @click="purgeConfirmed=false;panel='purge'">永久删除</button></div></div></template>
<template x-if="panel==='purge'"><div><h3 x-text="'永久删除 '+trashChosen.length+' 个'+(trashKind==='video'?'视频':'图包')+'？'"></h3><p class="sheet-sub">永久删除会移除源文件，不能撤销；备份也不能恢复已删除文件。图包会删除整包目录及其中所有图片。</p><label class="confirm-line"><input type="checkbox" aria-label="确认永久删除源文件" x-model="purgeConfirmed"><span>我确认永久删除所选源文件</span></label><div class="sheet-actions"><button class="text-button" @click="panel='trash'">取消</button><button class="primary danger-bg" :disabled="!purgeConfirmed||taskBusy" @click="purgeTrash()" x-text="taskBusy?'正在删除…':'确认永久删除'"></button></div></div></template>
<template x-if="panel==='backup'"><div><h3>保存你的整理成果</h3><p class="sheet-sub">包含两套标签与关联、目录映射、回收站、预览轮次、图包进度和阅读偏好。不包含媒体文件、个人口令与本机外观偏好。</p><button class="row" @click="exportData()">导出备份<span x-html="icon('down')"></span></button><label class="row import-label">选择备份文件<input type="file" accept="application/json" aria-label="导入备份" @change="importData($event)"></label><p class="footnote">先校验、再核对目录映射。恢复前保留当前管理数据快照。已永久删除的源文件不会从备份恢复。</p><button class="row" x-show="rollbackAvailable" @click="loadRollback()"><span class="grow"><h3>恢复前的快照</h3><p>查看并恢复上一次替换前的管理数据</p></span><span x-html="icon('next')"></span></button><button class="text-button wide" x-show="pendingJobs" @click="panel='tasks'">查看后台操作结果</button></div></template>
<template x-if="panel==='restoreBackup'"><div><p class="sheet-sub">校验通过。恢复会替换现有管理数据，请核对目录映射；留空表示暂不启用该目录。</p><p class="backup-counts" x-text="backupSummary"></p><template x-for="r in pendingImport?.rootDefs||[]"><label class="field-label"><span x-text="r.name+' · '+(r.kind==='video'?'视频':'图包')"></span><input class="tag-input" :aria-label="'恢复目录 '+r.name" x-model="restoreMappings[r.id]"><small class="path" x-text="'原目录：'+r.path"></small></label></template><label class="confirm-line"><input type="checkbox" aria-label="确认替换管理数据" x-model="restoreConfirmed"><span>我知道恢复会替换现有管理数据</span></label><p class="sheet-sub">恢复不会回滚磁盘文件删除，也不修改连接口令、本机暗黑模式和相邻视频准备。</p><div class="sheet-actions"><button class="text-button" @click="pendingImport=null;panel='backup'">取消</button><button class="primary" :disabled="!restoreConfirmed||taskBusy" @click="confirmRestore()" x-text="taskBusy?'正在恢复…':'确认恢复'"></button></div></div></template>
<template x-if="panel==='tasks'"><div><p class="sheet-sub">请求超时不代表操作失败。查询已有任务结果，不重复提交删除或恢复。</p><div class="empty" x-show="!jobs.length">暂无操作任务</div><template x-for="j in [...jobs].reverse()" :key="j.id"><div class="task-row"><h3 x-text="j.title"></h3><p :class="{danger:j.status==='failed'}" x-text="jobLabel(j)"></p><button class="text-button" x-show="['pending','failed'].includes(j.status)" :disabled="taskBusy" @click="queryJob(j.id)">查询结果</button></div></template></div></template>

<template x-if="panel==='videoDetails'"><div><h3 x-text="video.title"></h3><p class="sheet-sub" x-text="(video.id==='v-landscape'?'横版':'竖版')+' · '+video.duration+' · MP4'"></p><p class="path" x-text="(rootDefs.find(r=>r.kind==='video')?.path||'/media/videos')+'/'+video.folder+'/'+video.title+'.mp4'"></p><p class="footnote" x-text="video.tags.map(t=>'# '+t).join(' · ')"></p></div></template>

<template x-if="panel==='tags'"><div><p class="sheet-sub" x-text="chosen.length?'为选中的 '+chosen.length+' 个'+(tagKind==='video'?'视频':'图包')+'追加标签，保留原有标签。':tagTargets[0]?.title+' · '+(tagKind==='video'?'只修改这个视频':'应用于整个图包')"></p><div class="chips"><template x-for="t in editTagOptions"><button :class="{on:draftTags.includes(t)}" :aria-pressed="draftTags.includes(t)" @click="toggleTag(t)" x-text="(draftTags.includes(t)?'✓ ':'')+t"></button></template></div><form class="tag-form" @submit.prevent="addTag()"><input class="tag-input" x-model="tagInput" :placeholder="'新增'+(tagKind==='video'?'视频':'图包')+'标签'" aria-label="新标签"><button class="secondary" type="submit">添加</button></form></div></template>
<template x-if="panel==='filter'"><div><p class="sheet-sub">多个标签同时满足；与目录和其他条件一起生效。</p><div class="chips"><template x-for="t in currentCatalog"><button :class="{on:filters.includes(t)}" @click="setFilter(t)" x-text="'# '+t"></button></template></div><div class="setting-row"><span>目录</span><button class="text-button" @click="panel='folder'" x-text="scope.folder?.split(' / ').at(-1)||'全部目录'"></button></div><div class="setting-row" x-show="kind==='video'"><span>方向</span><select aria-label="视频方向" x-model="scope.orientation"><option value="all">全部</option><option value="portrait">竖屏</option><option value="landscape">横屏</option></select></div><div class="setting-row" x-show="kind==='video'"><span>时长</span><select aria-label="视频时长" x-model="scope.duration"><option value="all">全部</option><option value="short">15 秒以内</option><option value="long">15 秒以上</option></select></div><div class="setting-row" x-show="kind==='pack'"><span>阅读状态</span><select aria-label="阅读状态" x-model="statusFilter"><option>全部</option><option>未读</option><option>在读</option><option>已读</option></select></div><div class="sheet-actions"><button class="text-button" @click="clearScope()">重置</button><button class="primary" @click="panel=''" x-text="'查看 '+filteredItems.length+' '+itemUnit"></button></div></div></template>
<template x-if="panel==='folder'"><div><p class="sheet-sub" x-text="kind==='video'?'短视频（包含子目录）':'示例图包目录'"></p><template x-for="folder in kind==='video'?['','短视频 / 竖屏','短视频 / 横屏']:['',...packs.map(p=>p.folder)]"><button class="row" @click="scope.folder=folder;panel=''" :aria-pressed="scope.folder===folder"><span x-text="folder||'全部目录'"></span><span x-show="scope.folder===folder" x-html="icon('check')"></span></button></template></div></template>
<template x-if="panel==='queue'"><div><p class="sheet-sub" x-text="queueLabel+' · '+queueIds.length+' 个视频'"></p><div class="chips"><template x-for="o in ['顺序','随机']"><button :class="{on:queueOrder===o}" @click="setQueueOrder(o)" x-text="o"></button></template></div><div class="queue-list"><template x-for="(id,n) in queueIds"><button class="queue-row" :class="{active:n===queueAt}" @click="chooseQueue(id)"><span class="num" x-text="n+1"></span><img :src="videos.find(v=>v.id===id).cover" alt=""><span class="grow" x-text="videos.find(v=>v.id===id).title"></span><span x-show="n===queueAt">当前</span></button></template></div><p class="footnote">打标签不会改变本次预览范围；返回后按最新标签更新结果。</p></div></template>
<template x-if="panel==='packScope'"><div><p class="sheet-sub" x-text="queueLabel+' · '+queueIds.length+' 个图包'"></p><template x-for="(id,n) in queueIds"><button class="queue-row" :class="{active:n===queueAt}" @click="openPack(id)"><span class="num" x-text="n+1"></span><img :src="packs.find(p=>p.id===id).pages[0]" alt=""><span class="grow" x-text="packs.find(p=>p.id===id).title"></span><span x-show="n===queueAt">当前</span></button></template><button class="text-button wide" @click="closeReader()">返回来源结果</button></div></template>
<template x-if="panel==='queue-end'"><div><h3>本次范围已到末尾</h3><p class="sheet-sub" x-text="queueLabel+' · 共 '+queueIds.length+' 个视频'"></p><div class="sheet-actions"><button class="text-button" @click="queueAt=0;activateVideo(queueIds[0])">再看一遍</button><button class="primary" @click="closeContent()">返回来源</button></div></div></template>
<template x-if="panel==='finished'"><div><img class="detail-image" :src="pack.pages[0]" alt=""><h2 x-text="pack.title"></h2><p class="sheet-sub">已读到本包末尾。</p><button class="row" x-show="nextPack" @click="movePack(1)"><span><h3 x-text="nextPack?.title"></h3><p>本次结果中的下一包</p></span><span x-html="icon('next')"></span></button><p class="sheet-sub" x-show="!nextPack">这是本次结果中的最后一包。</p><button class="primary wide" @click="closeReader()">返回来源</button></div></template>
<template x-if="panel==='packActions'"><div><p class="sheet-sub" x-text="menuPack?.title"></p><button class="row" @click="openPack(menuPack.id)">阅读图包<span x-html="icon('book')"></span></button><button class="row" @click="editTags(menuPack.id)">整包标签<span x-html="icon('tag')"></span></button><button class="row" @click="startPackQuick(menuPack.id)">从这包开始快速整理<span x-html="icon('filter')"></span></button><button class="row danger" @click="askDelete(menuPack.id)">整包移入回收站</button></div></template>
<template x-if="panel==='pack-more'"><div><button class="row" @click="packQuick=!packQuick;controls=true;panel=''" x-text="packQuick?'退出快速整理':'进入快速整理'"></button><button class="row" @click="editTags(pack.id)">图包标签<span x-html="icon('tag')"></span></button><button class="row" @click="panel='details'">图包详情<span x-html="icon('next')"></span></button><button class="row" @click="jump(0);panel=''">从头阅读<span x-html="icon('history')"></span></button><button class="row danger" @click="askDelete(pack.id)">整包移入回收站</button></div></template>
<template x-if="panel==='videoMore'"><div><button class="row" @click="panel='videoDetails'">视频详情<span x-html="icon('next')"></span></button><button class="row" @click="setDevicePreference('dark',!devicePrefs.dark)" x-text="devicePrefs.dark?'切换浅色模式':'切换暗黑模式'"></button><button class="row" @click="panel='queue'">本次预览范围<span x-html="icon('grid')"></span></button><button class="row" @click="quick=!quick;panel=''" x-text="quick?'退出快速整理':'进入快速整理'"></button><button class="row" @click="editTags(video.id)">视频标签<span x-html="icon('tag')"></span></button><button class="row danger" @click="askDelete(video.id)">移入回收站</button></div></template>
<template x-if="panel==='rename'"><div><p class="sheet-sub" x-text="'只修改'+(editingTagKind==='video'?'视频':'图包')+'标签及其关联。'"></p><input class="tag-input" aria-label="标签名称" x-model="tagRename"><button class="primary wide" style="margin-top:18px" @click="renameTag()">保存名称</button><button class="text-button danger wide" @click="panel='removeTag'">移除这个标签</button></div></template>
<template x-if="panel==='removeTag'"><div><h3 x-text="editingTag"></h3><p class="sheet-sub" x-text="'移除这个'+(editingTagKind==='video'?'视频':'图包')+'标签及其关联，保留所有媒体内容。另一类同名标签不受影响。'"></p><div class="sheet-actions"><button class="text-button" @click="panel='rename'">取消</button><button class="primary danger-bg" @click="mutateTag(null)">确认移除标签</button></div></div></template>
<template x-if="panel==='create'"><form @submit.prevent="createTag()"><p class="sheet-sub" x-text="'新标签只出现在'+typeName+'分类中。'"></p><input class="tag-input" aria-label="标签名称" x-model="createName" placeholder="输入标签名称"><button class="primary wide" style="margin-top:18px">创建标签</button></form></template>

<template x-if="panel==='delete'"><div><h3 x-text="allItems.find(i=>i.id===deleteId)?.title"></h3><p class="sheet-sub">从媒体库和当前预览中移除，保留源文件、标签与进度。可以在回收站恢复。</p><div class="sheet-actions"><button class="text-button" @click="panel=''">取消</button><button class="primary danger-bg" @click="trash()">移入回收站</button></div></div></template>

</div><footer class="sheet-footer" x-show="panel==='tags'"><button class="text-button" @click="panel=''">取消</button><button class="primary" @click="saveTags()" x-text="chosen.length?'追加所选标签':tagKind==='video'?'保存视频标签':'保存整包标签'"></button></footer><footer class="sheet-footer" x-show="panel==='reader-settings'"><button class="primary" @click="panel=''">继续阅读</button></footer></section></div>
<div class="toast" x-show="notice" role="status"><span x-text="notice"></span><button x-show="lastRemoved" @click="undoTrash()">撤销</button></div><div class="error-banner" x-show="error" role="alert"><span x-text="error"></span><button @click="error=''">关闭</button></div></main></body></html>
