<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留白 · 完整媒体产品原型</title><link rel="stylesheet" href="style.css"><script src="data.js"></script><script src="reader-base.js"></script><script src="product.js"></script><script defer src="vendor/alpine.min.js"></script></head><body>
<main class="app" x-data="productApp()" @keydown.window="key($event)" x-cloak>
<template x-if="screen==='home'"><div style="display:contents">
<header class="topbar"><button class="icon" x-show="variant==='b'&&tab==='browse'" aria-label="回到媒体库" @click="nav('library')" x-html="icon('back')"></button><button class="icon" x-show="tagResults" aria-label="返回标签" @click="nav('tags')" x-html="icon('back')"></button><h1 x-text="title"></h1><span class="spacer"></span><button class="icon" x-show="['browse','library'].includes(tab)" aria-label="目录范围" @click="panel='folder'" x-html="icon('folder')"></button><button class="icon" x-show="tab==='browse'" aria-label="切换播放顺序" @click="kind==='video'?(videoOrder=videoOrder==='顺序'?'随机':'顺序',toast(videoOrder+'播放')):randomPack()" x-html="icon('shuffle')"></button><button class="icon" x-show="tab!=='settings'" aria-label="更多操作" @click="panel='more'" x-html="icon('more')"></button></header>
<div class="kindbar" x-show="variant==='a'&&!tagResults&&['browse','library'].includes(tab)"><button :class="{active:kind==='video'}" @click="setKind('video')">视频</button><button :class="{active:kind==='pack'}" @click="setKind('pack')">图包</button><span class="count" x-text="kind==='video'?videoOrder+'播放':'以图包为单位'"></span></div>
<div class="kindbar channel-views" x-show="variant==='c'&&!tagResults&&['browse','library'].includes(tab)"><button :class="{active:tab==='browse'}" @click="setView('browse')" x-text="channel==='video'?'随便看看':'逐包看'"></button><button :class="{active:tab==='library'}" @click="setView('library')" x-text="channel==='video'?'视频库':'图包书架'"></button><span class="count" x-text="available.filter(i=>i.type===kind).length+(kind==='pack'?' 包':' 个视频')"></span></div>
<template x-if="tab==='browse'&&kind==='video'&&available.some(i=>i.id===video.id)&&filters.every(t=>video.tags.includes(t))"><div style="display:contents"><div class="video-stage" @pointerdown="videoGesture=$event.clientY" @pointerup="videoSwipe($event)">
<video :src="video.src" :poster="video.cover" playsinline preload="metadata" @loadedmetadata="videoDuration=$event.target.duration;videoTime=0;$event.target.playbackRate=videoSpeed" @timeupdate="videoTime=$event.target.currentTime" @play="videoPlaying=true" @pause="videoPlaying=false" @ended="videoPlaying=false" @error="videoError=true" @click="videoControls=!videoControls" aria-label="视频播放器"></video>
<button class="video-play" x-show="!videoPlaying" @click="toggleVideo()" aria-label="播放视频" x-html="icon('play')"></button>
<div class="video-seek" x-show="videoControls"><button @click="toggleVideo()" :aria-label="videoPlaying?'暂停视频':'播放视频'" x-text="videoPlaying?'暂停':'播放'"></button><input type="range" min="0" :max="videoDuration||1" step="0.1" :value="videoTime" @input="document.querySelector('video').currentTime=Number($event.target.value)" aria-label="视频进度"><span x-text="fmt(videoTime)+' / '+fmt(videoDuration)"></span><select x-model.number="videoSpeed" @change="document.querySelector('video').playbackRate=videoSpeed" aria-label="播放速度"><option :value="1">1×</option><option :value="1.5">1.5×</option><option :value="2">2×</option></select></div>
<div class="video-fail" x-show="videoError"><p>视频暂时无法播放</p><button class="secondary" @click="videoError=false;document.querySelector('video').load()">重新加载</button></div></div>
<div class="video-actions"><button class="icon" aria-label="上一个视频" @click="stepVideo(-1)" x-html="icon('up')"></button><button class="text-button" @click="editTags(video.id)"><span x-html="icon('tag')"></span>视频标签</button><button class="text-button" :class="{active:quick}" @click="quick=!quick">快速整理</button><button class="icon" aria-label="下一个视频" @click="stepVideo(1)" x-html="icon('down')"></button></div>
<div class="cleanup" x-show="quick"><span>快速整理</span><button @click="panel='filter'">筛选</button><button @click="editTags(video.id)">打标签</button><button class="danger" @click="askDelete(video.id)">移入回收站</button></div></div></template>
<template x-if="tab==='browse'&&kind==='pack'&&available.some(i=>i.id===pack.id)&&filters.every(t=>pack.tags.includes(t))"><div style="display:contents">
<div class="cover-stage" tabindex="0" role="button" aria-label="阅读当前图包" @pointerdown="startGesture($event)" @pointerup="endGesture($event,true)" @keydown.enter="openPack(pack.id)"><img :src="pack.pages[0]" :alt="pack.title"><span class="cover-index" x-text="pack.pages.length+' 张'"></span></div>
<div class="pack-caption"><div class="caption-row"><h2 x-text="pack.title"></h2><span class="spacer"></span><span class="muted" x-text="'NO.'+pack.number"></span></div><p x-text="pack.author+' · '+(progress[pack.id]===undefined?'未读':'读到第 '+(progress[pack.id]+1)+' 张')"></p><div class="text-tags"><template x-for="t in pack.tags"><button @click="fromTag(t)" x-text="'# '+t"></button></template><button @click="editTags(pack.id)">＋ 标签</button></div></div>
<div class="cover-actions"><button class="icon" aria-label="上一包" @click="movePack(-1)" x-html="icon('up')"></button><button class="primary" @click="openPack(pack.id)" x-text="progress[pack.id]===undefined?'阅读图包':'继续阅读 · 第 '+(progress[pack.id]+1)+' 张'"></button><button class="icon" aria-label="下一包" @click="movePack(1)" x-html="icon('down')"></button></div>
</div></template>
<div class="empty browse-empty" x-show="tab==='browse'&&!(kind==='video'?available.some(i=>i.id===video.id)&&filters.every(t=>video.tags.includes(t)):available.some(i=>i.id===pack.id)&&filters.every(t=>pack.tags.includes(t)))"><p>当前范围内没有可浏览的内容</p><button class="text-button" @click="tab='library'">查看媒体库</button></div>
<template x-if="tab==='library'"><div style="display:contents">
<div class="kindbar" x-show="variant==='b'||tagResults"><button :class="{active:kind==='all'}" @click="setKind('all')">全部</button><button :class="{active:kind==='video'}" @click="setKind('video')">视频</button><button :class="{active:kind==='pack'}" @click="setKind('pack')">图包</button><button class="count" @click="kind==='video'?browseVideos():browsePacks()" x-text="kind==='video'?'连续播放 →':'逐包看 →'"></button></div>
<div class="search-row"><span class="search-symbol" x-html="icon('search')"></span><input type="search" x-model="search" aria-label="搜索媒体" :placeholder="kind==='pack'?'搜索图包、作者或目录':kind==='video'?'搜索视频或目录':'搜索视频、图包或作者'"></div>
<section class="library" x-ref="library" aria-label="媒体库内容">
<div x-show="!search&&!filters.length&&!multi">
<button class="continue" x-show="kind==='pack'" @click="openPack(recent.id)"><img :src="recent.pages[0]" alt=""><span class="grow"><span class="small muted">继续阅读</span><h2 x-text="recent.title"></h2><span class="small muted" x-text="'第 '+((progress[recent.id]??0)+1)+' / '+recent.pages.length+' 张'"></span><span class="progress-line"><i :style="'width:'+(((progress[recent.id]??0)+1)/recent.pages.length*100)+'%'"></i></span></span><span x-html="icon('next')"></span></button>
<div class="recent-block" x-show="variant==='b'&&kind==='all'"><div class="section-label"><span>接着看</span><button @click="nav('recent')">全部记录 →</button></div><div class="recent-pair"><template x-for="i in recentItems.slice(0,2)"><button @click="openItem(i)"><img :src="i.cover" alt=""><span><strong x-text="i.title"></strong><small x-text="i.type==='pack'?'图包 · 第 '+((progress[i.id]??0)+1)+' 张':'视频 · '+i.duration"></small></span></button></template></div></div>
</div>
<div class="filters"><button :class="{active:statusFilter==='全部'}" @click="statusFilter='全部'">全部</button><template x-for="s in kind==='pack'?['未读','在读']:[]"><button :class="{active:statusFilter===s}" @click="statusFilter=s" x-text="s"></button></template><button @click="panel='filter'" aria-label="标签筛选" x-html="icon('filter')"></button><button class="sort" @click="sort=sort==='名称'?'最近加入':'名称'" x-text="sort+' ↓'"></button><button @click="multi=!multi;chosen=[]" x-text="multi?'完成':'多选'"></button></div>
<div class="scope" x-show="filters.length"><span>同时包含</span><template x-for="t in filters"><button @click="setFilter(t)" x-text="t+' ×'"></button></template></div>
<div class="collection-count"><span x-text="filteredItems.length+' 个'+(kind==='pack'?'图包':kind==='video'?'视频':'条目')"></span><span x-show="kind==='pack'">文件夹即图包</span></div>
<div class="grid"><template x-for="i in filteredItems" :key="i.id"><article class="tile" :data-item="i.id"><button class="check-circle" :class="{on:chosen.includes(i.id)}" x-show="multi" @click="selectPack(i.id)" :aria-label="'选择 '+i.title" :aria-pressed="chosen.includes(i.id)"><span x-show="chosen.includes(i.id)" x-html="icon('check')"></span></button><button class="tile-cover" :class="{'video-cover':i.type==='video'}" @click="openItem(i)" :aria-label="(i.type==='video'?'播放 ':'阅读 ')+i.title"><img :src="i.cover" :alt="i.title" loading="lazy"><span class="page-badge" x-text="i.type==='pack'?i.pages.length+' 张':i.duration"></span><span class="type-badge" x-show="kind==='all'" x-text="i.type==='pack'?'图包':'视频'"></span><span class="reading-badge" x-show="kind==='pack'&&progress[i.id]!==undefined&&!multi" x-text="progress[i.id]>=(i.pages?.length||0)-1?'已读':'在读 · '+(progress[i.id]+1)"></span></button><h3 x-text="i.title"></h3><div class="meta"><span x-text="i.author"></span><button class="icon mini" :aria-label="'编辑标签 '+i.title" @click="chosen=[];editTags(i.id)" x-html="icon('more')"></button></div><div class="mini-tag" x-text="i.tags.map(t=>'# '+t).join('  ')"></div></article></template></div>
<div class="empty" x-show="!filteredItems.length"><p>没有符合条件的内容</p><button class="text-button" @click="search='';filters=[];statusFilter='全部'">清除筛选</button></div>
</section><div class="batch" x-show="multi"><span x-text="'已选 '+chosen.length+' 项'"></span><button class="text-button" @click="chosen=filteredItems.map(i=>i.id)">全选</button><button class="primary" :disabled="!chosen.length" @click="editTags()">批量标签</button></div>
</div></template>
<section class="simple-page" x-show="tab==='recent'"><div class="section-label">最近看过</div><template x-for="i in recentItems"><button class="history-item" @click="openItem(i)"><img :src="i.cover" alt=""><span class="grow"><h2 x-text="i.title"></h2><p x-text="i.type==='pack'?'图包 · 读到第 '+((progress[i.id]??0)+1)+' 张':'视频 · '+i.duration"></p></span><span x-html="icon('next')"></span></button></template></section>
<section class="simple-page tags-page" x-show="tab==='tags'"><p class="page-intro">一个标签，找到相关视频与图包。</p><template x-for="t in allTags"><div class="tag-row"><button @click="fromTag(t)"><span class="tag-hash">#</span><span class="grow"><h3 x-text="t"></h3><p x-text="tagCount(t,'video')+' 个视频 · '+tagCount(t,'pack')+' 个图包'"></p></span></button><button class="icon" :aria-label="'管理标签 '+t" @click="manageTag(t)" x-html="icon('more')"></button></div></template><p class="footnote">图包标签覆盖整包，不对单张图片打标。</p></section>
<section class="simple-page settings-page" x-show="tab==='settings'"><div class="server-card"><span class="server-mark" x-html="icon('folder')"></span><div><h2>我的 NAS</h2><p>视频与图包共用一个媒体服务</p></div></div>
<button class="row" @click="openSettings('connection')"><span><h3>服务器连接</h3><p x-text="connection"></p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('roots')"><span><h3>媒体目录</h3><p>短视频 · 217 Cos图包</p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('defaults')"><span><h3>阅读偏好</h3><p x-text="'默认'+(defaultMode==='horizontal'?'横向翻页':'纵向拼接')+' · 每包单独记忆'"></p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('trash')"><span><h3>回收站</h3><p x-text="trashIds.length+' 项 · 可恢复'"></p></span><span x-html="icon('next')"></span></button>
<button class="row" @click="openSettings('backup')"><span><h3>备份与恢复</h3><p>标签、阅读进度与偏好</p></span><span x-html="icon('next')"></span></button><p class="footnote">留白 · 私人媒体浏览器</p></section>
<nav class="nav" aria-label="主导航"><template x-for="n in navItems"><button :class="{active:activeNav===n[0]}" @click="nav(n[0])" :aria-label="n[1]"><span x-html="icon(n[2])"></span><span x-text="n[1]"></span></button></template></nav>
</div></template>
<template x-if="screen==='video'"><section class="video-full"><header class="topbar"><button class="icon" aria-label="返回媒体库" @click="closeVideo()" x-html="icon('back')"></button><h2 x-text="video.title"></h2><span class="spacer"></span><button class="icon" aria-label="视频操作" @click="panel='more'" x-html="icon('more')"></button></header><div class="video-stage" @pointerdown="videoGesture=$event.clientY" @pointerup="videoSwipe($event)">
<video :src="video.src" :poster="video.cover" playsinline preload="metadata" @loadedmetadata="videoDuration=$event.target.duration;videoTime=0;$event.target.playbackRate=videoSpeed" @timeupdate="videoTime=$event.target.currentTime" @play="videoPlaying=true" @pause="videoPlaying=false" @ended="videoPlaying=false" @error="videoError=true" @click="videoControls=!videoControls" aria-label="视频播放器"></video>
<button class="video-play" x-show="!videoPlaying" @click="toggleVideo()" aria-label="播放视频" x-html="icon('play')"></button>
<div class="video-seek" x-show="videoControls"><button @click="toggleVideo()" :aria-label="videoPlaying?'暂停视频':'播放视频'" x-text="videoPlaying?'暂停':'播放'"></button><input type="range" min="0" :max="videoDuration||1" step="0.1" :value="videoTime" @input="document.querySelector('video').currentTime=Number($event.target.value)" aria-label="视频进度"><span x-text="fmt(videoTime)+' / '+fmt(videoDuration)"></span><select x-model.number="videoSpeed" @change="document.querySelector('video').playbackRate=videoSpeed" aria-label="播放速度"><option :value="1">1×</option><option :value="1.5">1.5×</option><option :value="2">2×</option></select></div>
<div class="video-fail" x-show="videoError"><p>视频暂时无法播放</p><button class="secondary" @click="videoError=false;document.querySelector('video').load()">重新加载</button></div></div>
<div class="video-actions"><button class="icon" aria-label="上一个视频" @click="stepVideo(-1)" x-html="icon('up')"></button><button class="text-button" @click="editTags(video.id)"><span x-html="icon('tag')"></span>视频标签</button><button class="text-button" :class="{active:quick}" @click="quick=!quick">快速整理</button><button class="icon" aria-label="下一个视频" @click="stepVideo(1)" x-html="icon('down')"></button></div>
<div class="cleanup" x-show="quick"><span>快速整理</span><button @click="panel='filter'">筛选</button><button @click="editTags(video.id)">打标签</button><button class="danger" @click="askDelete(video.id)">移入回收站</button></div></section></template>
 <template x-if="screen==='reader'"><section class="reader" :class="{immersive:!controls}" aria-label="图包阅读器">
  <header class="reader-top"><button class="icon" aria-label="返回上一页" @click="closeReader()" x-html="icon('back')"></button><div class="grow"><h2 x-text="pack.title"></h2><p x-text="pack.author+' · '+pack.number"></p></div><button class="icon" aria-label="阅读设置" @click="panel='reader-settings'" x-html="icon('settings')"></button><button class="icon" aria-label="图包更多" @click="panel='pack-more'" x-html="icon('more')"></button></header>
  <div class="reader-content">
   <template x-if="mode==='horizontal'"><div class="paged" :class="{zoom}" @pointerdown="startGesture($event)" @pointerup="endGesture($event)" @dblclick.prevent="zoom=!zoom;controls=true"><img :src="pack.pages[page]" :alt="pack.title+' 第 '+(page+1)+' 张'" @error="failedImage=true" :style="fit==='width'&&!zoom?'height:auto;min-height:100%;object-fit:contain':''" draggable="false"></div></template>
   <template x-if="mode==='vertical'"><div class="reader-scroll" x-ref="strip" @scroll.throttle.80ms="onScroll()"><template x-for="(src,i) in pack.pages" :key="pack.id+'-'+i"><div class="strip-page" :class="{gap}" :data-page="i"><img :src="src" :width="pack.sizes[i][0]" :height="pack.sizes[i][1]" :alt="pack.title+' 第 '+(i+1)+' 张'" :loading="Math.abs(i-page)<=1?'eager':'lazy'" @click="controls=!controls"><span class="page-no" x-text="i+1"></span></div></template><div class="strip-end"><p>已到本包末尾</p><button class="primary" @click="movePack(1,true)">阅读下一包</button><button class="text-button" @click="closeReader()">返回上一页</button></div></div></template>
   <button class="strip-toggle" x-show="mode==='vertical'&&!controls" aria-label="显示阅读工具" @click="controls=true" x-html="icon('more')"></button>
   <div class="reader-empty" x-show="failedImage"><p>这一张暂时无法载入</p><button class="secondary" @click="pack.pages[page]=pack.pages[page].split('?')[0]+'?retry='+Date.now();failedImage=false">重试</button><button class="text-button" @click="advance(1)">跳过这一张</button></div>
  </div>
  <div class="reader-bottom"><div class="reader-progress"><button class="icon" aria-label="上一张" @click="advance(-1)" :disabled="page===0" x-html="icon('back')"></button><input class="range" type="range" min="0" :max="pageCount-1" :value="page" @input="jump($event.target.value)" aria-label="阅读页码"><span x-text="(page+1)+' / '+pageCount"></span><button class="icon" aria-label="下一张" @click="advance(1)" x-html="icon('next')"></button></div>
   <div class="reader-tools"><button @click="panel='overview'" aria-label="页码总览"><span x-html="icon('grid')"></span><span>总览</span></button><button @click="panel='reader-settings'"><span x-html="icon(mode==='vertical'?'vertical':'horizontal')"></span><span x-text="mode==='vertical'?'纵向拼接':'横向翻页'"></span></button><button @click="chosen=[];editTags(pack.id)" aria-label="整包标签"><span x-html="icon('tag')"></span><span>整包标签</span></button><button @click="controls=false" aria-label="沉浸阅读"><span x-html="icon('expand')"></span><span>沉浸</span></button></div>
   <div class="reading-context"><span x-text="'图包 '+(selected+1)+' / '+packs.filter(p=>!trashIds.includes(p.id)).length"></span><button @click="movePack(1,true)">下一包 <span x-html="icon('next')"></span></button></div>
  </div><span class="immersive-page" x-show="!controls" x-text="(page+1)+' / '+pageCount"></span>
 </section></template>

<div class="scrim" x-show="panel" @click.self="panel=''" x-cloak><section class="sheet" tabindex="-1" x-ref="sheet" role="dialog" aria-modal="true" :aria-label="sheetTitle"><header class="sheet-head"><h2 x-text="sheetTitle"></h2><button class="icon" aria-label="关闭面板" @click="panel=''" x-html="icon('close')"></button></header><div class="sheet-body">
   <template x-if="panel==='reader-settings'"><div><p class="sheet-sub" x-text="pack.title+' · 记住本包的阅读方式'"></p><div class="mode-options"><button class="mode-option" :class="{active:mode==='horizontal'}" @click="changeMode('horizontal')"><span x-html="icon('horizontal')"></span>横向翻页</button><button class="mode-option" :class="{active:mode==='vertical'}" @click="changeMode('vertical')"><span x-html="icon('vertical')"></span>纵向拼接</button></div><div class="setting-row" x-show="mode==='horizontal'"><span>翻页方向</span><select aria-label="翻页方向" x-model="direction" @change="changeMode(mode)"><option value="ltr">从左向右</option><option value="rtl">从右向左</option></select></div><div class="setting-row" x-show="mode==='horizontal'"><span>图片适配</span><select x-model="fit" aria-label="图片适配"><option value="contain">完整显示</option><option value="width">铺满画面</option></select></div><label class="setting-row" x-show="mode==='vertical'"><span>图片之间留间距</span><input type="checkbox" x-model="gap" @change="changeMode(mode)"></label><p class="sheet-sub" style="margin:18px 0 0" x-text="mode==='horizontal'?'左右滑动翻页，轻点中间收起工具。双击图片可放大，再次双击复原。':'上下滑动连续阅读，轻点图片收起工具。切换模式仍停在当前图片。'"></p></div></template>
   <template x-if="panel==='overview'"><div><p class="sheet-sub" x-text="pack.title+' · '+pageCount+' 张 · 文件名自然顺序'"></p><div class="page-grid"><template x-for="(src,i) in pack.pages"><button :class="{active:page===i}" @click="jump(i);panel=''" :aria-label="'跳到第 '+(i+1)+' 张'"><img :src="src" alt="" loading="lazy"><span x-text="i+1"></span></button></template></div></div></template>
   <template x-if="panel==='finished'"><div><img class="detail-image" :src="pack.pages[0]" alt=""><h2 x-text="pack.title"></h2><p class="sheet-sub" style="margin-top:10px">已到本包末尾。可以继续下一包，或回到图包库。</p><button class="row" @click="movePack(1,true)"><span><h3 x-text="nextPack.title"></h3><p>下一包</p></span><span x-html="icon('next')"></span></button><button class="text-button" @click="closeReader()">返回图包</button></div></template>
   <template x-if="panel==='details'"><div><img class="detail-image" :src="pack.pages[0]" alt=""><h2 x-text="pack.title"></h2><p class="sheet-sub" x-text="pack.author+' · '+pageCount+' 张'"></p><h3>原目录</h3><p class="path" x-text="'217 Cos图包 / '+pack.folder"></p><h3>整包标签</h3><p class="text-tags" x-text="pack.tags.join(' · ')"></p><button class="text-button" @click="editTags()">编辑标签</button></div></template>
<template x-if="panel==='tags'"><div><p class="sheet-sub" x-text="chosen.length?'为选中的 '+chosen.length+' 项追加标签，各自原有标签保留。':tagTargets[0]?.title+' · '+(targetId.startsWith('v-')?'应用于这个视频':'应用于整个图包')"></p><div class="chips"><template x-for="t in allTags"><button :class="{on:draftTags.includes(t)}" :aria-pressed="draftTags.includes(t)" @click="toggleTag(t)" x-text="(draftTags.includes(t)?'✓ ':'')+t"></button></template></div><form class="tag-form" @submit.prevent="addTag()"><input class="tag-input" x-model="tagInput" placeholder="添加一个新标签" aria-label="新标签"><button class="secondary" type="submit">添加</button></form></div></template>
<template x-if="panel==='filter'"><div><p class="sheet-sub">仅显示同时包含所选标签的内容。</p><div class="chips"><template x-for="t in allTags"><button :class="{on:filters.includes(t)}" @click="setFilter(t)" x-text="'# '+t"></button></template></div><div class="sheet-actions"><button class="text-button" @click="filters=[]">清除</button><button class="primary" @click="panel=''">查看结果</button></div></div></template>
<template x-if="panel==='more'"><div><button class="row" x-show="tab==='library'" @click="multi=!multi;chosen=[];panel=''" x-text="multi?'退出多选':'多选媒体'"></button><button class="row" @click="browseVideos()">连续浏览视频 <span x-html="icon('play')"></span></button><button class="row" @click="browsePacks()">逐包浏览图包 <span x-html="icon('book')"></span></button><button class="row" @click="nav('recent');panel=''">最近看过 <span x-html="icon('history')"></span></button><button class="row" x-show="tab==='browse'||screen==='video'" @click="editTags(screen==='video'||kind==='video'?video.id:pack.id)">为当前内容打标签 <span x-html="icon('tag')"></span></button><button class="row danger" x-show="tab==='browse'||screen==='video'" @click="askDelete(screen==='video'||kind==='video'?video.id:pack.id)">移入回收站</button></div></template>
<template x-if="panel==='pack-more'"><div><button class="row" @click="editTags(pack.id)">整包标签 <span x-html="icon('tag')"></span></button><button class="row" @click="panel='details'">图包详情 <span x-html="icon('next')"></span></button><button class="row" @click="jump(0);panel=''">从头阅读 <span x-html="icon('history')"></span></button><button class="row danger" @click="askDelete(pack.id)">整包移入回收站</button></div></template>
<template x-if="panel==='folder'"><div><p class="sheet-sub">选择当前浏览范围</p><button class="row" @click="setKind('video');channel='video';panel=''">短视频 <span>视频</span></button><button class="row" @click="setKind('pack');channel='pack';panel=''">217 Cos图包 <span>图包</span></button><p class="footnote">图包保留完整文件夹结构，包含包内子目录。</p></div></template>
<template x-if="panel==='connection'"><div><label class="field-label">服务地址<input class="tag-input" x-model="connectionDraft" aria-label="服务地址" placeholder="http://nas.local:8000"></label><p class="sheet-sub">填写 NAS 上媒体服务的地址。视频与图包使用同一个连接。</p><button class="primary wide" @click="saveConnection()">保存连接</button></div></template>
<template x-if="panel==='roots'"><div><p class="sheet-sub">按目录声明媒体类型，分别建立视频列表和图包书架。</p><label class="setting-row"><span>短视频 <small>视频目录</small></span><input type="checkbox" :checked="rootEnabled.video" @change="toggleRoot('video')"></label><label class="setting-row"><span>217 Cos图包 <small>SATA存储11 / 200 R-资源</small></span><input type="checkbox" :checked="rootEnabled.pack" @change="toggleRoot('pack')"></label><p class="footnote">每个直属文件夹识别为一个图包；包内图片递归读取，按文件名自然顺序排列。</p></div></template>
<template x-if="panel==='defaults'"><div><p class="sheet-sub">首次打开图包时使用。已阅读的图包沿用各自的设置。</p><div class="mode-options"><button class="mode-option" :class="{active:defaultMode==='horizontal'}" @click="setDefault('horizontal')"><span x-html="icon('horizontal')"></span>横向翻页</button><button class="mode-option" :class="{active:defaultMode==='vertical'}" @click="setDefault('vertical')"><span x-html="icon('vertical')"></span>纵向拼接</button></div><p class="footnote">页码、翻页方向和图片间距随图包保存。</p></div></template>
<template x-if="panel==='trash'"><div><p class="sheet-sub">移入回收站后不再参与浏览。恢复后回到原来的目录，标签与阅读进度仍在。</p><template x-for="id in trashIds"><div class="row"><span x-text="allItems.find(i=>i.id===id)?.title"></span><button class="text-button" @click="restore(id)">恢复</button></div></template><div class="empty" x-show="!trashIds.length">回收站为空</div></div></template>
<template x-if="panel==='delete'"><div><h3 x-text="allItems.find(i=>i.id===deleteId)?.title"></h3><p class="sheet-sub">从浏览列表中移除，保留源文件、标签和进度。可以在设置的回收站恢复。</p><div class="sheet-actions"><button class="text-button" @click="panel=''">取消</button><button class="primary danger-bg" @click="trash()">移入回收站</button></div></div></template>
<template x-if="panel==='backup'"><div><p class="sheet-sub">保存标签、图包阅读进度、回收站状态和阅读偏好。</p><button class="row" @click="exportData()">导出备份 <span x-html="icon('down')"></span></button><label class="row import-label">从备份恢复 <input type="file" accept="application/json" aria-label="导入备份" @change="importData($event)"></label></div></template>
<template x-if="panel==='rename'"><div><p class="sheet-sub">修改后，关联视频和图包中的标签一起更新。</p><input class="tag-input" aria-label="标签名称" x-model="tagRename"><button class="primary wide" style="margin-top:20px" @click="renameTag()">保存标签名称</button></div></template>

</div><footer class="sheet-footer" x-show="panel==='tags'"><button class="text-button" @click="panel=''">取消</button><button class="primary" @click="saveTags()" x-text="chosen.length?'追加所选标签':targetId.startsWith('v-')?'保存视频标签':'保存整包标签'"></button></footer><footer class="sheet-footer" x-show="panel==='reader-settings'"><button class="primary" @click="panel=''">继续阅读</button></footer></section></div>
<div class="toast" x-show="notice" x-text="notice" role="status"></div><div class="error-banner" x-show="error" role="alert"><span x-text="error"></span><button @click="error=''">关闭</button></div></main></body></html>
