name: video-viewer-client-e2e
services:
  server:
    build:
      context: ./services/server
      target: test
    image: video-viewer-server:e2e
    user: "1000:1000"
    ports:
      - "127.0.0.1:8761:8760"
    environment:
      VV_E2E_FIXTURE: enabled
      VV_DATA_DIR: /data
      VV_MOUNTS_FILE: /fixture/mounts.json
      VV_PASSPHRASE_FILE: /fixture/passphrase
      VV_SCAN_INTERVAL: "0"
      VV_STABILITY_SECONDS: "0.1"
    volumes:
      - "${VV_E2E_HOME:?Run scripts/prepare-client-e2e.sh}/data:/data"
      - "${VV_E2E_HOME}/media:/media"
      - "${VV_E2E_HOME}/config:/fixture:ro"
      - "${VV_E2E_ASSETS:?Run scripts/prepare-client-e2e.sh}:/fixture-assets:ro"
    command: [uvicorn, "tests.e2e_server:create_e2e_app", --factory, --host, 0.0.0.0, --port, "8760", --workers, "1", --no-access-log]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
