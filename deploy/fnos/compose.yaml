name: shika
services:
  server:
    image: ${SHIKA_IMAGE:-shika-server:1.0.3}
    container_name: shika-server
    user: "${SHIKA_UID:-1000}:${SHIKA_GID:-1000}"
    ports:
      - "${SHIKA_BIND_ADDRESS:?Set the NAS LAN address}:${SHIKA_PORT:-8760}:8760"
    environment:
      VV_DATA_DIR: /data
      VV_MOUNTS_FILE: /config/mounts.json
      VV_SCAN_INTERVAL: "900"
      VV_STABILITY_SECONDS: "2"
      VV_MEDIA_STREAMS: "3"
      VV_BACKUP_MAX_BYTES: "33554432"
      VV_LEGACY_PURGE_PREVIEWS: "false"
    volumes:
      - type: bind
        source: ${SHIKA_DEPLOY_DIR:?Set the deployment directory}/data
        target: /data
      - type: bind
        source: ${SHIKA_DEPLOY_DIR}/config
        target: /config
        read_only: true
      - type: bind
        source: ${SHIKA_VIDEO_DIR:?Set the video directory}
        target: /media
      - type: bind
        source: ${SHIKA_PACK_DIR:?Set the image pack directory}
        target: /packs-cos
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
